/* ===== css/styles.css ===== */
/* 晨昏日程 · 全局样式与今日视图 */

/* ---------------- 设计变量 ---------------- */
:root {
  --bg: #f6f3ec;
  --bg-soft: #efeae0;
  --surface: #ffffff;
  --surface-2: #faf8f2;
  --ink: #242a28;
  --ink-soft: #3c4642;
  --muted: #7b857f;
  --line: #e8e3d7;
  --line-strong: #d9d1c1;
  --accent: #2f6f62;
  --accent-2: #3f8577;
  --accent-soft: #e3f0eb;
  --accent-ink: #245a4f;
  --warm: #c9773f;
  --warm-soft: #f8eadf;
  --danger: #c2503f;
  --danger-soft: #f9e5e1;
  --ok: #3e8a6b;
  --ok-soft: #e4f1ea;
  --shadow: 0 10px 30px rgba(63, 55, 38, 0.08);
  --shadow-sm: 0 2px 10px rgba(63, 55, 38, 0.06);
  --radius: 20px;
  --radius-sm: 13px;
  --maxw: 1120px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  --bg: #121614;
  --bg-soft: #171d1a;
  --surface: #1a211e;
  --surface-2: #1f2723;
  --ink: #e9ede9;
  --ink-soft: #cdd5cf;
  --muted: #8c978f;
  --line: #2b3530;
  --line-strong: #3a463f;
  --accent: #6fbfa8;
  --accent-2: #58a48f;
  --accent-soft: #21372f;
  --accent-ink: #a9dccb;
  --warm: #e0a273;
  --warm-soft: #33251b;
  --danger: #e0806f;
  --danger-soft: #3a2320;
  --ok: #7fc7a6;
  --ok-soft: #1e332a;
  --shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.3);
}

/* ---------------- 基础 ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--ink);
  background:
    radial-gradient(1100px 520px at 88% -12%, rgba(201, 119, 63, 0.10), transparent 62%),
    radial-gradient(900px 480px at -8% 8%, rgba(47, 111, 98, 0.09), transparent 58%),
    var(--bg);
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.ico { width: 20px; height: 20px; display: inline-block; vertical-align: -4px; flex: none; }

/* ---------------- 应用外壳 ---------------- */
.app { max-width: var(--maxw); margin: 0 auto; padding: 0 20px calc(28px + var(--safe-b)); }
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 2px 12px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 40px; height: 40px; border-radius: 13px; flex: none;
  display: grid; place-items: center;
  color: #fdf9f0; font-size: 19px; font-weight: 700;
  background: linear-gradient(145deg, #3a7d6e, #245a4f 70%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 6px 16px rgba(36, 90, 79, 0.28);
}
.brand-text { min-width: 0; }
.brand-text h1 { font-size: 16px; letter-spacing: 0.06em; line-height: 1.25; }
.brand-text p { margin-top: 1px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs-top { margin-left: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs-top .tab {
  border: 0; background: transparent; color: var(--muted);
  padding: 7px 18px; border-radius: 999px; font-size: 13.5px; transition: 0.18s;
}
.tabs-top .tab:hover { color: var(--ink); }
.tabs-top .tab.active { background: var(--surface); color: var(--accent-ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.icon-btn {
  width: 40px; height: 40px; flex: none;
  display: inline-grid; place-items: center;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-soft);
  transition: 0.16s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; position: relative; }
.icon-btn.sm::after { content: ''; position: absolute; inset: -3px; border-radius: 12px; }
.icon-btn.sm .ico { width: 17px; height: 17px; }
.icon-btn.plain { border-color: transparent; background: transparent; }
.icon-btn.plain:hover { background: var(--surface-2); transform: none; }
.view { padding-top: 6px; }

.tabbar { display: none; }
main.view { min-height: 60vh; }

/* ---------------- 页面骨架 ---------------- */
.page { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 21px; letter-spacing: 0.01em; }
.page-head p { color: var(--muted); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.stack > * + * { margin-top: 12px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); letter-spacing: 0.08em; margin: 4px 2px 0; }

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-hd { display: flex; align-items: center; gap: 10px; padding: 17px 20px 0; }
.card-title { font-size: 15.5px; font-weight: 650; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
.card-title .ico { color: var(--accent); }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.card-bd { padding: 16px 20px 20px; }
.card-hd + .card-bd { padding-top: 12px; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 8px 16px;
  border-radius: 11px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink-soft);
  font-size: 13.5px; font-weight: 550; text-decoration: none;
  transition: 0.16s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn .ico { width: 17px; height: 17px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #f7fbf8; box-shadow: 0 4px 14px rgba(47, 111, 98, 0.24); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
.btn-danger { color: var(--danger); border-color: var(--line-strong); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); background: var(--surface); }
.btn-danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn-sm { min-height: 36px; padding: 5px 12px; font-size: 12.5px; border-radius: 9px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* ---------------- 表单 ---------------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 12.5px; color: var(--muted); font-weight: 550; letter-spacing: 0.02em; }
.input, .textarea, .select {
  width: 100%; min-height: 42px; padding: 10px 12px;
  border: 1px solid var(--line-strong); border-radius: 11px;
  background: var(--surface-2); color: var(--ink);
  font-size: 16px; transition: 0.16s;
}
.textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: 0.75; }
.hint { font-size: 11.5px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .field.full { grid-column: 1 / -1; }

/* ---------------- 小部件 ---------------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11.5px; color: var(--muted); white-space: nowrap;
}
.chip.active { background: var(--accent-soft); border-color: var(--line); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent-ink); }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 7px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap;
}
.badge.warm { background: var(--warm-soft); color: var(--warm); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.plain { background: var(--bg-soft); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--bg-soft); font-size: 11.5px; color: var(--muted); }
.progress { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.35s ease; }
.progress.warm > i { background: linear-gradient(90deg, var(--warm), #e0a273); }
.progress.over > i { background: linear-gradient(90deg, #d06a52, #b8432f); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--bg-soft); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 8px; font-size: 12.5px; }
.seg button.active { background: var(--surface); color: var(--accent-ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.empty-state {
  padding: 34px 22px; text-align: center; color: var(--muted); font-size: 13.5px;
  border: 1.5px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface-2);
}
.empty-state strong { display: block; color: var(--ink-soft); font-size: 15px; margin-bottom: 4px; }
.empty-state .btn { margin-top: 14px; }

/* ---------------- 今日视图 ---------------- */
.daybar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 55%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.daybar-main { min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.daybar .day-date { font-size: 25px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.daybar .day-week { font-size: 13.5px; color: var(--muted); }
.daybar .day-rel { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #f7fbf8; font-weight: 600; }
.daybar .day-rel.minor { background: var(--bg-soft); color: var(--muted); }
.daybar-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.date-input {
  min-height: 40px; padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft);
  font-size: 15px; color-scheme: light;
}
[data-theme="dark"] .date-input { color-scheme: dark; }

.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
.weekday {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 8px; border-radius: 14px;
  border: 1px solid transparent; background: transparent; color: var(--ink-soft);
  transition: 0.16s;
}
.weekday .wd { font-size: 11px; color: var(--muted); }
.weekday b { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.weekday .dots { display: flex; gap: 3px; height: 5px; }
.weekday .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: 0.55; }
.weekday .dot.done { opacity: 1; }
.weekday .dot.empty { background: var(--line-strong); opacity: 1; }
.weekday:hover { background: var(--surface); border-color: var(--line); }
.weekday.active { background: var(--surface); border-color: var(--line); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow-sm); }
.weekday.active b { color: var(--accent-ink); }
.weekday.today:not(.active) b { color: var(--accent); }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.summary-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.ring {
  --p: 0; flex: none; width: 46px; height: 46px; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);
  display: grid; place-items: center;
}
.ring::after {
  content: attr(data-label); width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; color: var(--accent-ink);
}
.summary-card .sc-label { font-size: 11.5px; color: var(--muted); }
.summary-card .sc-value { font-size: 18px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.summary-card .sc-value small { font-size: 11.5px; font-weight: 500; color: var(--muted); }
.summary-card .sc-value.over { color: var(--danger); }
.ring.warm { background: conic-gradient(var(--warm) calc(var(--p) * 1%), var(--line) 0); }
.ring.warm::after { color: var(--warm); }
.ring[data-label="0%"]::after { color: var(--muted); }

/* 课程（时段内的时间块） */
.p-courses { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.p-course {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 13px 11px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--c, var(--accent));
  background: var(--surface);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 5%, var(--surface)), var(--surface));
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: 0.16s;
}
.p-course:hover { border-color: color-mix(in srgb, var(--c) 38%, var(--line)); transform: translateY(-1px); }
.p-course.is-canceled { opacity: 0.62; background: var(--surface-2); border-left-color: var(--line-strong); }
.p-course.is-canceled .pc-time b,
.p-course.is-canceled .pc-main h3 { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.pc-time { flex: none; width: 52px; text-align: center; }
.pc-time b { display: block; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
.pc-time span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pc-main { min-width: 0; flex: 1; }
.pc-main h3 { font-size: 14px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.pc-meta { margin-top: 2px; font-size: 11.5px; color: var(--muted); display: flex; gap: 9px; flex-wrap: wrap; }
.pc-meta .ico { width: 12px; height: 12px; margin-right: 2px; }
.pc-main .course-content { margin-top: 5px; font-size: 12.5px; }
.pc-main .course-day-note { margin-top: 5px; font-size: 11.5px; padding: 4px 8px; }

.course-card {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px 14px 14px;
  border-radius: 15px; border: 1px solid var(--line);
  background: var(--surface);
  border-left: 4px solid var(--c, var(--accent));
  box-shadow: var(--shadow-sm);
  transition: 0.16s;
  cursor: pointer;
}
.course-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--c) 35%, var(--line)); }
.course-time { flex: none; width: 54px; text-align: center; padding-top: 1px; }
.course-time b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
.course-time span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-main { min-width: 0; flex: 1; }
.course-main h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.course-meta { margin-top: 3px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.course-meta .ico { width: 13px; height: 13px; margin-right: 2px; }
.course-content { margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
.course-content .lbl { color: var(--muted); font-size: 11.5px; margin-right: 4px; }
.course-card .icon-btn { margin-left: 2px; }
.course-day-note { margin-top: 6px; font-size: 12.5px; color: var(--warm); background: var(--warm-soft); border-radius: 8px; padding: 5px 9px; display: inline-block; }

/* 早中晚时段 */
.period-card { padding: 15px 18px 8px; }
.period-hd { display: flex; align-items: center; gap: 11px; }
.period-icon { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 12px; font-size: 18px; background: var(--bg-soft); }
.period-hd h2 { font-size: 16px; letter-spacing: 0.02em; }
.period-hd .p-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.period-hd .p-count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.period-hd .p-count b { color: var(--accent-ink); }
.period-hd .p-add { margin-left: 6px; }
.task-list { margin-top: 6px; }
.task {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) 36px;
  gap: 10px; align-items: start;
  padding: 11px 2px;
  border-bottom: 1px dashed var(--line);
  position: relative;
}

.rm-mmonth,
.rm-mnote { min-width: 0; }
.rm-mdel {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;

.rm-mdel:hover { color: var(--rm-danger); background: var(--rm-surface2); }
.rm-msedit-empty {
  margin: 0 0 2px;
  font-size: 12.5px;
  color: var(--rm-muted);
}

/* 弹窗里的「已完成」开关 */
.rm-switch {
  gap: 8px;
  justify-content: flex-start;
  width: 100%;
  height: 38px;

  font-style: normal;
  font-size: 13px;

/* ---------------- 键盘可达性 ---------------- */
.rm-page button:focus-visible,
.rm-form button:focus-visible,
.rm-page .input:focus-visible,
.rm-form .input:focus-visible {
  outline: 2px solid var(--rm-accent);
  outline-offset: 2px;
}

  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;

/* 桌面端轻微悬浮反馈（不依赖 hover 也能用） */
@media (hover: hover) {
  .rm-card:hover {
    box-shadow: 0 0 0 1px var(--rm-line), 0 14px 30px -20px rgba(66, 48, 30, 0.5);

  /* ---------------- 任务排期（推荐完成时间） ---------------- */
  /* 每天三个时段，课程与已定时间的任务视为占位，其余任务按顺序排出建议时间 */
  S.scheduleDay = function (key) {

    var day = S.day(key, false) || S.blankDay();
    // 所有「定了固定时间」的任务都参与避让（不管属于哪个时段）

      fixedBlocks.push({ s: s, e: e, kind: 'fixed', id: t.id, label: t.title });
    });

    Object.keys(App.PERIODS).forEach(function (pid) {

        var s = U.timeToMin(c.start), e = U.timeToMin(c.end);

        blocks.push({ s: U.timeToMin(c.start), e: U.timeToMin(c.end), kind: 'course', id: c.id, label: c.name });
      });
      fixedBlocks.forEach(function (b) {

          e = s + dur;

          task: t,
          start: s == null ? '' : U.minToTime(s),
          end: e == null ? '' : U.minToTime(e),
          overflow: s == null

      result[pid] = { period: P, courses: periodCourses, items: items };
    });

      monthRemain: monthBudget - spent,

<script>
/* ===== js/app.js ===== */
/* 晨昏日程 · 应用外壳：导航、主题、弹窗、Toast、视图调度 */
(function () {
  'use strict';
  var App = window.App;
  var U = App.util;

  App.views = App.views || {};
  App.ui = { tab: 'daily', dateKey: U.todayKey(), roadmapFocus: null };

  /* ---------------- 图标 ---------------- */
  var ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    up: '<path d="m6 14 6-6 6 6"/>',
    down: '<path d="m6 10 6 6 6-6"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2V5Z"/><path d="M8 3v18"/>',
    pin: '<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',

    refresh: '<path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/>'
  };
  App.icon = function (name, cls) {
    var inner = ICONS[name] || ICONS.spark;
    return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  };

  /* ---------------- 主题 ---------------- */
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  App.applyTheme = function () {
    var mode = App.store.state.settings.theme || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && media && media.matches);
    // 方便分享/测试：?theme=light 或 ?theme=dark 临时覆盖
    var forced = /[?&]theme=(light|dark)(?:&|$)/.exec(window.location.search);
    if (forced) dark = forced[1] === 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var btn = document.getElementById('themeBtn');
    if (btn) {
      btn.innerHTML = App.icon(dark ? 'sun' : 'moon');
      btn.title = dark ? '切换到浅色' : '切换到深色';
    }
  };
  App.toggleTheme = function () {
    var cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    App.store.state.settings.theme = cur === 'dark' ? 'light' : 'dark';
    App.store.save();
    App.applyTheme();
  };
  if (media && media.addEventListener) media.addEventListener('change', function () { if ((App.store.state.settings.theme || 'auto') === 'auto') App.applyTheme(); });

  /* ---------------- Toast ---------------- */
  App.toast = function (msg, type) {
    var layer = document.getElementById('toast-layer');
    if (!layer) return;
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast-' + type : '');
    el.textContent = msg;
    layer.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 260);
    }, type === 'error' ? 3600 : 2200);
  };

  /* ---------------- 弹窗 ---------------- */
  App.openModal = function (opts) {
    opts = opts || {};
    var layer = document.getElementById('modal-layer');
    var wrap = document.createElement('div');
    wrap.className = 'modal-overlay';
    var head = '<div class="modal-head"><h3>' + U.esc(opts.title || '') + '</h3>' +
      '<button class="icon-btn" data-close aria-label="关闭">' + App.icon('x') + '</button></div>';
    var foot = '';
    if (opts.footer && opts.footer.length) {
      foot = '<div class="modal-foot">' + opts.footer.map(function (b, i) {
        return '<button class="btn ' + (b.cls || 'btn-ghost') + '" data-mfoot="' + i + '">' + U.esc(b.label) + '</button>';
      }).join('') + '</div>';
    }
    wrap.innerHTML = '<div class="modal ' + (opts.size ? 'modal-' + opts.size : '') + '" role="dialog" aria-modal="true">' +
      head + '<div class="modal-body">' + (opts.html || '') + '</div>' + foot + '</div>';
    var box = wrap.querySelector('.modal');
    layer.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add('show'); });

    function close(result) {
      wrap.classList.remove('show');
      setTimeout(function () { wrap.remove(); }, 180);
      document.removeEventListener('keydown', onKey);
      if (opts.onClose) opts.onClose(result);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap) return close();
      var t = e.target.closest('[data-close]');
      if (t) return close();
      var f = e.target.closest('[data-mfoot]');
      if (f) {
        var btn = opts.footer[Number(f.getAttribute('data-mfoot'))];
        if (!btn) return;
        var r = btn.onClick ? btn.onClick(box, close) : undefined;
        if (r !== false) close();
      }
    });
    if (opts.onOpen) setTimeout(function () { opts.onOpen(box, close); }, 0);
    var first = box.querySelector('input, textarea, select');
    if (first) setTimeout(function () { try { first.focus(); } catch (e) {} }, 60);
    return { el: box, close: close };
  };

  App.confirm = function (opts) {
    if (typeof opts === 'string') opts = { text: opts };
    return new Promise(function (resolve) {
      App.openModal({
        title: opts.title || '确认操作',
        html: '<p class="confirm-text">' + U.nl2br(opts.text || '') + '</p>',
        footer: [
          { label: '取消', cls: 'btn-ghost' },
          { label: opts.okLabel || '确定', cls: opts.danger ? 'btn-danger' : 'btn-primary', onClick: function () { resolve(true); } }
        ],
        onClose: function () { resolve(false); }
      });
    });
  };

  /* ---------------- 导航与刷新 ---------------- */
  App.setTab = function (tab, opts) {
    if (!App.views[tab]) tab = 'daily';
    App.ui.tab = tab;
    if (opts && opts.dateKey) App.ui.dateKey = opts.dateKey;
    App.refresh();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  App.goDate = function (key) {
    if (!U.validKey(key)) return;
    App.ui.dateKey = key;
    App.refresh();
  };

  App.refresh = function () {
    var view = document.getElementById('view');
    if (!view) return;
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === App.ui.tab);
    });
    var v = App.views[App.ui.tab];
    view.innerHTML = '';
    if (!v || typeof v.render !== 'function') {
      view.innerHTML = '<div class="empty-state">该板块正在加载…</div>';
      return;
    }
    try {
      v.render(view);
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="empty-state">这个板块出错了：' + U.esc(e.message) + '<br><button class="btn btn-ghost" onclick="location.reload()">重新载入</button></div>';
    }
    var sub = document.getElementById('brandSub');
    if (sub) {
      var demo = App.store.state.settings.demo;
      sub.textContent = U.fmtCN(U.todayKey()) + (demo ? ' · 示例数据' : '');
    }
  };

  App.initShell = function () {
    App.ui.dateKey = U.todayKey();
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { App.setTab(b.getAttribute('data-tab')); });
    });
    var themeBtn = document.getElementById('themeBtn');
    if (themeBtn) themeBtn.addEventListener('click', App.toggleTheme);
    // 跨天自动刷新：每分钟检查一次日期
    var lastDay = U.todayKey();
    setInterval(function () {
      var now = U.todayKey();
      if (now !== lastDay) {
        lastDay = now;
        if (App.ui.dateKey !== now && App.ui.tab === 'daily') App.ui.dateKey = now;
        if (App.applyTheme) App.applyTheme();
        App.refresh();
      }
    }, 30000);
  };
})();

</script>
<script>
/* ===== js/daily.js ===== */
/* 晨昏日程 · 今日视图：日期、课程、早中晚任务、推荐完成时间、预算、当天记录 */
(function () {
  'use strict';
  var App = window.App, U = App.util, S = App.store, B = App.budget;
  var PERIOD_ORDER = ['morning', 'afternoon', 'evening'];

  App.views = App.views || {};
  App.views.daily = { render: render };

  /* ---------------- 小工具 ---------------- */
  function fmtMinutes(min) {
    min = Math.round(Number(min) || 0);
    if (min < 60) return min + ' 分钟';
    var h = Math.floor(min / 60), m = min % 60;
    return h + ' 小时' + (m ? ' ' + m + ' 分' : '');
  }
  function pct(a, b) { return b > 0 ? U.clamp(Math.round(a / b * 100), 0, 100) : 0; }
  function periodTasks(day, pid) { return (day.tasks || []).filter(function (t) { return t.slot === pid; }); }

  /* ---------------- 渲染 ---------------- */
  function render(view) {
    var key = App.ui.dateKey || U.todayKey();
    if (!U.validKey(key)) { key = U.todayKey(); App.ui.dateKey = key; }
    var today = U.todayKey();
    var day = S.day(key, false) || S.blankDay();
    var schedule = S.scheduleDay(key);
    var info = B.monthInfo(key);
    var tasks = day.tasks || [];
    var doneCount = tasks.filter(function (t) { return t.done; }).length;
    var planned = U.sum(tasks, function (t) { return t.duration; });
    var doneMin = U.sum(tasks.filter(function (t) { return t.done; }), function (t) { return t.duration; });

    view.innerHTML =
      '<div class="page">' +
        renderDaybar(key, today) +
        renderWeekstrip(key) +
        renderSummary(key, tasks, doneCount, planned, doneMin) +
        '<div class="grid-2">' +
          '<div class="stack">' +
            PERIOD_ORDER.map(function (pid) { return renderPeriod(key, pid, schedule[pid], day); }).join('') +
          '</div>' +
          '<div class="stack">' +
            renderBudget(key, info, today) +
            renderNote(key, day) +
            renderCarryover(key) +
          '</div>' +
        '</div>' +
      '</div>';

    bind(view, key);
  }

  function renderDaybar(key, today) {
    var rel = U.relativeLabel(key);
    return '<div class="daybar">' +
      '<button class="icon-btn plain" data-act="prev-day" aria-label="前一天">' + App.icon('left') + '</button>' +
      '<div class="daybar-main">' +
        '<span class="day-date">' + U.fmtDate(key) + '</span>' +
        '<span class="day-week">周' + U.WEEKDAY_CN[U.weekdayOf(key) - 1] + '</span>' +
        (rel ? '<span class="day-rel' + (rel === '今天' ? '' : ' minor') + '">' + rel + '</span>' : '') +
      '</div>' +
      '<div class="daybar-tools">' +
        '<input class="date-input" type="date" value="' + key + '" data-act="pick-date" aria-label="选择日期">' +
        (key !== today ? '<button class="btn btn-sm btn-ghost" data-act="today">回到今天</button>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="course-manage">' + App.icon('book') + '<span>课表</span></button>' +
      '</div>' +
      '<button class="icon-btn plain" data-act="next-day" aria-label="后一天">' + App.icon('right') + '</button>' +
      '</div>';
  }

  function renderWeekstrip(key) {
    var monday = U.sameWeek(key), today = U.todayKey();
    var html = '<div class="weekstrip" role="tablist" aria-label="本周日期">';
    for (var i = 0; i < 7; i++) {
      var dk = U.addDays(monday, i);
      var c = S.dayTaskCount(dk);
      var courseCount = S.coursesOn(dk).filter(function (x) { return !x.canceled; }).length;
      var dots = '';
      if (c.total > 0) {
        for (var j = 0; j < Math.min(3, c.total); j++) {
          dots += '<span class="dot' + (j < c.done ? ' done' : '') + '"></span>';
        }
      } else if (courseCount > 0) {
        dots = '<span class="dot" style="background:var(--warm);opacity:.7"></span>';
      } else {
        dots = '<span class="dot empty"></span>';
      }
      html += '<button class="weekday' + (dk === key ? ' active' : '') + (dk === today ? ' today' : '') + '" data-act="goto-date" data-date="' + dk + '">' +
        '<span class="wd">' + (i === 6 ? '日' : '周' + U.WEEKDAY_CN[i]) + '</span>' +
        '<b>' + U.parseKey(dk).getDate() + '</b>' +
        '<span class="dots">' + dots + '</span>' +
        '</button>';
    }
    return html + '</div>';
  }

  function renderSummary(key, tasks, done, planned, doneMin) {
    var p = pct(done, tasks.length);
    var info = B.monthInfo(key);
    var spent = B.spentOn(key);
    var remain = info.dailyBudget - spent;
    var isToday = key === U.todayKey();
    return '<div class="summary">' +
      '<div class="card summary-card">' +
        '<div class="ring" style="--p:' + p + '" data-label="' + p + '%"></div>' +
        '<div><div class="sc-label">当日任务</div><div class="sc-value">' + done + '<small> / ' + tasks.length + ' 件</small></div></div>' +
      '</div>' +
      '<div class="card summary-card">' +
        '<div class="ring warm" style="--p:' + pct(doneMin, planned) + '" data-label="' + fmtShort(doneMin) + '"></div>' +
        '<div><div class="sc-label">安排时长</div><div class="sc-value">' + fmtShort(planned) + '<small> · 已 ' + fmtShort(doneMin) + '</small></div></div>' +
      '</div>' +
      '<div class="card summary-card">' +
        '<div><div class="sc-label">' + (isToday ? '今日可花' : '当日可花') + '</div><div class="sc-value ' + (remain < 0 ? 'over' : '') + '">' + U.money(remain) + '</div>' +
        '<div class="sc-label">已花 ' + U.money(spent) + ' / ' + U.money(info.dailyBudget) + '</div></div>' +
      '</div>' +
      '</div>';
  }
  function fmtShort(min) {
    min = Math.round(min || 0);
    if (min < 60) return min + '分';
    var h = Math.floor(min / 60), m = min % 60;
    return h + (m ? '.' + Math.round(m / 60 * 10) : '') + 'h';
  }

  /* 每个时段里：课程（占住时间）→ 任务（含推荐完成时间） */
  function renderPeriod(key, pid, sched, day) {
    var P = App.PERIODS[pid];
    var items = (sched && sched.items) || [];
    var courses = (sched && sched.courses) || [];
    var tasks = items.map(function (it) { return it.task; });
    var done = tasks.filter(function (t) { return t.done; }).length;
    var planned = U.sum(tasks, function (t) { return t.duration; });
    var rows = items.map(function (it) { return renderTaskRow(key, pid, it); }).join('');

    return '<section class="card period-card" data-period="' + pid + '">' +
      '<div class="period-hd">' +
        '<span class="period-icon" aria-hidden="true">' + P.icon + '</span>' +
        '<div><h2>' + P.label + '</h2>' +
          '<p class="p-sub">' + P.hint + (courses.length ? ' · ' + courses.length + ' 节课' : '') + (planned ? ' · 任务 ' + fmtMinutes(planned) : '') + '</p></div>' +
        '<span class="p-count"><b>' + done + '</b>/' + tasks.length + '</span>' +
      '</div>' +
      (courses.length ? '<div class="p-courses">' + courses.map(renderPeriodCourse).join('') + '</div>' : '') +
      '<ul class="task-list">' + (rows || '') + '</ul>' +
      '<form class="quick-add" data-period="' + pid + '" autocomplete="off">' +
        '<input type="text" placeholder="' + P.label + '加一件事，回车保存…" maxlength="80" aria-label="' + P.label + '添加任务">' +
        '<button type="submit" aria-label="添加">' + App.icon('plus') + '</button>' +
      '</form>' +
      '</section>';
  }

  function renderPeriodCourse(c) {
    return '<article class="p-course' + (c.canceled ? ' is-canceled' : '') + '" data-act="course-edit" data-id="' + U.esc(c.id) + '" style="--c:' + U.esc(c.color || '#2F6F62') + '">' +
      '<div class="pc-time"><b>' + U.esc(c.start || '--:--') + '</b><span>' + U.esc(c.end || '') + '</span></div>' +
      '<div class="pc-main">' +
        '<h3>' + U.esc(c.name) +
          (c.extra ? ' <span class="badge warm">临时</span>' : '') +
          (c.canceled ? ' <span class="badge plain">今天停课</span>' : '') +
        '</h3>' +
        '<div class="pc-meta">' +
          (c.location ? '<span>' + App.icon('pin') + U.esc(c.location) + '</span>' : '') +
          (c.teacher ? '<span>' + U.esc(c.teacher) + '</span>' : '') +
        '</div>' +
        (c.content ? '<div class="course-content"><span class="lbl">授课</span>' + U.esc(c.content) + '</div>' : '') +
        (c.note ? '<div class="course-day-note">📌 ' + U.esc(c.note) + '</div>' : '') +
        (c.canceled ? '<div class="hint" style="margin-top:4px">点一下可以取消停课、恢复当天内容</div>' : '') +
      '</div>' +
      '</article>';
  }

  function renderTaskRow(key, pid, item) {
    var t = item.task;
    var chips = [];
    if (t.start) {
      chips.push('<span class="task-time">⏰ ' + U.esc(U.fmtRange(item.start, item.end)) + '</span>');
    } else if (item.start) {
      chips.push('<span class="task-time">建议 ' + U.esc(U.fmtRange(item.start, item.end)) + '</span>');
    } else {
      chips.push('<span class="task-time muted-time">今天排不下</span>');
    }
    chips.push('<span class="pill">' + U.esc(t.category || '学习') + '</span>');
    chips.push('<span class="pill">' + fmtMinutes(t.duration) + '</span>');
    if (t.priority === 'high') chips.push('<span class="badge warm">重要</span>');
    if (t.priority === 'low') chips.push('<span class="chip">顺手</span>');

    return '<li class="task' + (t.done ? ' done' : '') + ' priority-' + U.esc(t.priority || 'normal') + '" data-id="' + U.esc(t.id) + '">' +
      '<button class="task-check" data-act="toggle" data-id="' + U.esc(t.id) + '" aria-label="标记完成" aria-pressed="' + (t.done ? 'true' : 'false') + '">' + App.icon('check') + '</button>' +
      '<div class="task-main" data-act="task-edit" data-id="' + U.esc(t.id) + '">' +
        '<div class="task-title">' + U.esc(t.title) + '</div>' +
        '<div class="task-meta">' + chips.join('') + '</div>' +
        (t.note ? '<div class="task-note">' + U.nl2br(t.note) + '</div>' : '') +
      '</div>' +
      '<button class="icon-btn sm plain task-more" data-act="task-menu" data-id="' + U.esc(t.id) + '" aria-label="更多操作">' + App.icon('more') + '</button>' +
      '</li>';
  }

  function renderBudget(key, info, today) {
    var spent = B.spentOn(key);
    var budget = info.dailyBudget;
    var p = budget > 0 ? U.clamp(Math.round(spent / budget * 100), 0, 100) : 0;
    var over = budget > 0 && spent > budget;
    var day = S.day(key, false);
    var expenses = day ? day.expenses : [];

    var list = expenses.slice(0, 6).map(function (e) {
      return '<div class="spend-item">' +
        '<span class="s-cat">' + U.esc(e.category || '其他') + '</span>' +
        '<span class="s-note">' + U.esc(e.note || '未备注') + '</span>' +
        '<span class="s-amt">' + U.money(e.amount) + '</span>' +
        '<button class="s-del" data-act="del-expense" data-id="' + U.esc(e.id) + '" aria-label="删除这笔">' + App.icon('x') + '</button>' +
        '</div>';
    }).join('');

    // 最近 7 天柱状
    var bars = '';
    var maxBar = Math.max(budget, 1);
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var dk = U.addDays(key, -i);
      var v = B.spentOn(dk);
      days.push({ k: dk, v: v });
      if (v > maxBar) maxBar = v;
    }
    days.forEach(function (d) {
      var h = Math.max(4, Math.round(d.v / maxBar * 100));
      var label = U.parseKey(d.k).getDate();
      var cls = 'wb' + (d.v > 0 ? ' has' : '') + (budget > 0 && d.v > budget ? ' over' : '');
      bars += '<div class="' + cls + '" title="' + U.fmtDate(d.k) + ' 花费 ' + U.money(d.v) + '">' +
        '<i style="height:' + h + '%"></i><span>' + label + '</span></div>';
    });

    return '<section class="card">' +
      '<div class="card-hd">' +
        '<div><h2 class="card-title">' + App.icon('wallet') + '今日花费</h2>' +
        '<p class="card-sub">每天预算 ' + U.money(budget) + ' · 本月已花 ' + U.money(info.monthSpent) + '</p></div>' +
        '<div class="card-tools"><button class="btn btn-sm btn-primary" data-act="add-expense">记一笔</button></div>' +
      '</div>' +
      '<div class="card-bd">' +
        '<div class="budget-head"><span class="spent">' + U.money(spent) + '</span><span class="total">/ ' + U.money(budget) + '</span></div>' +
        '<div class="progress' + (over ? ' over' : '') + '" style="margin-top:8px"><i style="width:' + p + '%"></i></div>' +
        '<div class="budget-meta">' +
          '<span>今天还能花 <b>' + U.money(Math.max(0, budget - spent)) + '</b></span>' +
          '<span>本月还剩 <b>' + U.money(info.monthRemain) + '</b></span>' +
        '</div>' +
        (list ? '<div class="spend-list">' + list + '</div>' : '<p class="hint" style="margin-top:12px">还没记账。吃完顺手点「记一笔」，省钱计划才看得见。</p>') +
        '<div class="week-bars" aria-label="最近七天花费">' + bars + '</div>' +
        '<p class="hint" style="margin-top:6px">最近 7 天 · 本月预算按 ' + U.money(info.monthBudget) + ' 计' +
          (S.state.settings.saveGoal ? ' · 目标：' + U.esc(S.state.settings.saveGoal) : '') + '</p>' +
      '</div>' +
      '</section>';
  }

  function renderNote(key, day) {
    var moods = ['😀 不错', '🙂 还行', '😐 一般', '😪 有点累', '😤 不顺'];
    return '<section class="card">' +
      '<div class="card-hd">' +
        '<div><h2 class="card-title">' + App.icon('edit') + '今天记一笔</h2>' +
        '<p class="card-sub">课上讲了什么、要补什么，随手记</p></div>' +
        '<div class="card-tools"><span class="hint" data-note-hint>自动保存</span></div>' +
      '</div>' +
      '<div class="card-bd">' +
        '<textarea class="note-area" data-note placeholder="今天内科学讲了肺炎的鉴别诊断，笔记还没整理……">' + U.esc(day.note || '') + '</textarea>' +
        '<div class="mood-row">' + moods.map(function (m) {
          return '<button data-act="mood" data-mood="' + m + '" class="' + (day.mood === m ? 'active' : '') + '">' + m + '</button>';
        }).join('') + '</div>' +
      '</div>' +
      '</section>';
  }

  function renderCarryover(key) {
    // 过去 7 天（不含今天）没完成的任务
    var list = [];
    for (var i = 7; i >= 1 && list.length < 8; i--) {
      var dk = U.addDays(key, -i);
      var d = S.day(dk, false);
      if (!d) continue;
      d.tasks.forEach(function (t) {
        if (!t.done && list.length < 8) list.push({ key: dk, task: t });
      });
    }
    if (!list.length) return '';
    var rows = list.map(function (x) {
      return '<div class="spend-item"><span class="s-cat">' + U.parseKey(x.key).getMonth() + 1 + '/' + U.parseKey(x.key).getDate() + '</span>' +
        '<span class="s-note">' + U.esc(x.task.title) + '</span>' +
        '<button class="btn btn-sm btn-ghost" data-act="carry" data-id="' + U.esc(x.task.id) + '" data-from="' + x.key + '">移到今天</button></div>';
    }).join('');
    return '<section class="card">' +
      '<div class="card-hd"><div><h2 class="card-title">' + App.icon('refresh') + '还没做完</h2>' +
      '<p class="card-sub">过去 7 天没完成的事，点一下挪到今天</p></div></div>' +
      '<div class="card-bd"><div class="spend-list">' + rows + '</div></div>' +
      '</section>';
  }

  /* ---------------- 事件 ---------------- */
  function bind(view, key) {
    view.onclick = function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var act = el.getAttribute('data-act');
      var id = el.getAttribute('data-id');
      if (act === 'prev-day') { App.ui.dateKey = U.addDays(key, -1); App.refresh(); }
      else if (act === 'next-day') { App.ui.dateKey = U.addDays(key, 1); App.refresh(); }
      else if (act === 'today') { App.ui.dateKey = U.todayKey(); App.refresh(); }
      else if (act === 'goto-date') { App.ui.dateKey = el.getAttribute('data-date'); App.refresh(); }
      else if (act === 'toggle') {
        var t = S.findTask(key, id);
        if (t) {
          var wasDone = t.done;
          S.updateTask(key, id, { done: !wasDone });
          S.commit();
          if (!wasDone) App.toast('完成啦，继续加油 ✦');
        }
      }
      else if (act === 'task-edit') { openTaskEditor(key, id); }
      else if (act === 'task-menu') { openTaskMenu(key, id); }
      else if (act === 'add-expense') { openExpenseForm(key); }
      else if (act === 'del-expense') {
        var exp = (S.day(key, false) || { expenses: [] }).expenses.filter(function (x) { return x.id === id; })[0];
        App.confirm({
          title: '删除这笔记录',
          text: exp ? '确定删除「' + (exp.note || exp.category) + ' ' + U.money(exp.amount) + '」吗？' : '确定删除这笔记录吗？',
          danger: true, okLabel: '删除'
        }).then(function (ok) {
          if (!ok) return;
          B.removeExpense(key, id); S.commit(); App.toast('已删除这笔记录');
        });
      }
      else if (act === 'mood') {
        var newMood = el.getAttribute('data-mood');
        var d = S.day(key, true);
        d.mood = d.mood === newMood ? '' : newMood;
        S.save();
        var row = el.parentNode;
        if (row) row.querySelectorAll('button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-mood') === d.mood);
        });
      }
      else if (act === 'course-manage') { openCourseTable(); }
      else if (act === 'course-edit') { openDayCourseEditor(key, id); }
      else if (act === 'add-extra-course') { openCourseForm({ mode: 'extra', dayKey: key }); }
      else if (act === 'carry') {
        var from = el.getAttribute('data-from');
        var src = S.findTask(from, id);
        if (!src) return;
        var copy = JSON.parse(JSON.stringify(src));
        copy.id = U.uid('t'); copy.done = false;
        var target = S.day(key, true);
        target.tasks.push(copy);
        S.save(); App.refresh();
        App.toast('已挪到今天，原日期那条仍保留');
      }
    };

    view.onchange = function (e) {
      var el = e.target;
      if (el && el.getAttribute && el.getAttribute('data-act') === 'pick-date' && U.validKey(el.value)) {
        App.ui.dateKey = el.value;
        App.refresh();
      }
    };

    view.onsubmit = function (e) {
      var form = e.target;
      if (!form.classList || !form.classList.contains('quick-add')) return;
      e.preventDefault();
      var pid = form.getAttribute('data-period');
      var input = form.querySelector('input');
      var title = (input.value || '').trim();
      if (!title) return;
      S.addTask(key, pid, title);
      S.save();
      App.refresh();
      var again = document.querySelector('#view .quick-add[data-period="' + pid + '"] input');
      if (again) again.focus();
      App.toast('已加入' + App.PERIODS[pid].label);
    };

    // 当天记录自动保存
    var noteEl = view.querySelector('[data-note]');
    var hintEl = view.querySelector('[data-note-hint]');
    if (noteEl) {
      var saveNote = U.debounce(function () {
        var d = S.day(key, true);
        d.note = noteEl.value;
        S.save();
        if (hintEl) { hintEl.textContent = '已保存'; setTimeout(function () { if (hintEl) hintEl.textContent = '自动保存'; }, 1400); }
      }, 600);
      noteEl.addEventListener('input', function () {
        if (hintEl) hintEl.textContent = '保存中…';
        saveNote();
      });
    }
  }

  /* ---------------- 任务编辑 ---------------- */
  function openTaskEditor(key, id) {
    var t = S.findTask(key, id);
    if (!t) return;
    var slots = PERIOD_ORDER.map(function (p) {
      return '<option value="' + p + '"' + (t.slot === p ? ' selected' : '') + '>' + App.PERIODS[p].label + '</option>';
    }).join('');
    var prios = Object.keys(App.PRIORITIES).map(function (p) {
      return '<option value="' + p + '"' + (t.priority === p ? ' selected' : '') + '>' + App.PRIORITIES[p] + '</option>';
    }).join('');
    var cats = App.CATEGORIES.map(function (c) {
      return '<option value="' + U.esc(c) + '"' + (t.category === c ? ' selected' : '') + '>' + U.esc(c) + '</option>';
    }).join('');

    App.openModal({
      title: '编辑任务', size: 'lg',
      html: '<div class="form-grid">' +
        '<div class="field full"><label>任务内容</label><input class="input" data-f="title" maxlength="80" value="' + U.esc(t.title) + '"></div>' +
        '<div class="field"><label>放在哪个时段</label><select class="select" data-f="slot">' + slots + '</select></div>' +
        '<div class="field"><label>预计用时（分钟）</label><input class="input" type="number" min="5" max="600" step="5" data-f="duration" value="' + (t.duration || 30) + '"></div>' +
        '<div class="field"><label>优先级</label><select class="select" data-f="priority">' + prios + '</select></div>' +
        '<div class="field"><label>分类</label><select class="select" data-f="category">' + cats + '</select></div>' +
        '<div class="field"><label>固定开始（可选）</label><input class="input" type="time" data-f="start" value="' + U.esc(t.start || '') + '"></div>' +
        '<div class="field"><label>固定结束（可选）</label><input class="input" type="time" data-f="end" value="' + U.esc(t.end || '') + '"></div>' +
        '<div class="field full"><label>备注</label><textarea class="textarea" data-f="note" placeholder="写点提醒，比如「周五前要交」">' + U.esc(t.note || '') + '</textarea></div>' +
        '</div>' +
        '<p class="hint" style="margin-top:10px">不填固定时间时，会按顺序排出「推荐完成时间」，自动避开上课时间。</p>',
      footer: [
        { label: '删除', cls: 'btn-danger', onClick: function (box, close) {
          App.confirm({ title: '删除任务', text: '确定删除「' + t.title + '」吗？删除后无法恢复。', danger: true, okLabel: '删除' }).then(function (ok) {
            if (!ok) return;
            S.removeTask(key, id); S.commit(); App.toast('已删除任务');
          });
          return false;
        } },
        { label: '取消', cls: 'btn-ghost' },
        { label: '保存', cls: 'btn-primary', onClick: function (box) {
          var get = function (f) { var el = box.querySelector('[data-f="' + f + '"]'); return el ? el.value : ''; };
          var title = get('title').trim();
          if (!title) { App.toast('任务内容不能为空', 'error'); return false; }
          S.updateTask(key, id, {
            title: title, slot: get('slot'), duration: U.clamp(Number(get('duration')) || 30, 5, 600),
            priority: get('priority'), category: get('category'),
            start: get('start'), end: get('end'), note: get('note')
          });
          S.commit();
          App.toast('已保存');
        } }
      ]
    });
  }

  function openTaskMenu(key, id) {
    var t = S.findTask(key, id);
    if (!t) return;
    var moveBtns = PERIOD_ORDER.filter(function (p) { return p !== t.slot; }).map(function (p) {
      return '<button class="btn btn-ghost btn-block" data-move="' + p + '">移到' + App.PERIODS[p].label + '</button>';
    }).join('');
    App.openModal({
      title: t.title, size: 'sm',
      html: '<div class="stack">' +
        '<button class="btn btn-block" data-m="edit">' + App.icon('edit') + '编辑任务</button>' +
        '<div class="form-grid" style="grid-template-columns:1fr 1fr">' +
          '<button class="btn btn-ghost" data-m="up">' + App.icon('up') + '上移</button>' +
          '<button class="btn btn-ghost" data-m="down">' + App.icon('down') + '下移</button>' +
        '</div>' +
        moveBtns +
        '<div class="divider"></div>' +
        '<button class="btn btn-danger btn-block" data-m="del">' + App.icon('trash') + '删除任务</button>' +
        '</div>',
      onOpen: function (box, close) {
        box.addEventListener('click', function (e) {
          var b = e.target.closest('[data-m]');
          var mv = e.target.closest('[data-move]');
          if (mv) {
            S.updateTask(key, id, { slot: mv.getAttribute('data-move') });
            S.commit(); close(); App.toast('已移到' + App.PERIODS[mv.getAttribute('data-move')].label);
            return;
          }
          if (!b) return;
          var m = b.getAttribute('data-m');
          if (m === 'edit') { close(); setTimeout(function () { openTaskEditor(key, id); }, 180); return; }
          if (m === 'up' || m === 'down') {
            S.moveTask(key, id, m); S.commit(); close();
            App.toast('已调整顺序（只在本时段内移动）');
            return;
          }
          if (m === 'del') {
            App.confirm({ title: '删除任务', text: '确定删除「' + t.title + '」吗？删除后无法恢复。', danger: true, okLabel: '删除' }).then(function (ok) {
              if (!ok) return;
              S.removeTask(key, id); S.commit(); close(); App.toast('已删除任务');
            });
          }
        });
      }
    });
  }

  /* ---------------- 记账 ---------------- */
  function openExpenseForm(key) {
    var cats = App.SPEND_CATEGORIES.map(function (c) {
      return '<option value="' + U.esc(c) + '">' + U.esc(c) + '</option>';
    }).join('');
    var info = B.monthInfo(key);
    App.openModal({
      title: '记一笔 · ' + U.fmtDate(key), size: 'sm',
      html: '<div class="form-grid">' +
        '<div class="field full"><label>金额（元）</label><input class="input" type="number" min="0" step="0.01" data-e="amount" inputmode="decimal" placeholder="0.00"></div>' +
        '<div class="field"><label>分类</label><select class="select" data-e="category">' + cats + '</select></div>' +
        '<div class="field"><label>备注</label><input class="input" data-e="note" maxlength="40" placeholder="早餐 / 打印资料…"></div>' +
        '</div>' +
        '<p class="hint" style="margin-top:10px">今天已花 ' + U.money(B.spentOn(key)) + '，每日预算 ' + U.money(info.dailyBudget) + '，还能花 ' + U.money(Math.max(0, info.dailyBudget - B.spentOn(key))) + '。</p>',
      footer: [
        { label: '取消', cls: 'btn-ghost' },
        { label: '保存', cls: 'btn-primary', onClick: function (box) {
          var amount = Number(box.querySelector('[data-e="amount"]').value);
          if (!amount || amount <= 0) { App.toast('请输入正确的金额', 'error'); return false; }
          B.addExpense(key, {
            amount: amount,
            category: box.querySelector('[data-e="category"]').value,
            note: box.querySelector('[data-e="note"]').value.trim()
          });
          S.commit();
          App.toast('已记账 ' + U.money(amount));
        } }
      ]
    });
  }

  /* ---------------- 课程：当天内容 ---------------- */
  function openDayCourseEditor(key, id) {
    var c = S.coursesOn(key).filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    if (c.extra) return openCourseForm({ mode: 'extra', dayKey: key, id: id });
    var ov = (S.day(key, false) || { courseOverride: {} }).courseOverride[id] || {};

    App.openModal({
      title: '当天课程 · ' + c.name, size: 'lg',
      html: '<div class="stack">' +
        '<div class="course-card" style="--c:' + U.esc(c.color || '#2F6F62') + ';cursor:default">' +
          '<div class="course-time"><b>' + U.esc(c.start) + '</b><span>' + U.esc(c.end) + '</span></div>' +
          '<div class="course-main"><h3>' + U.esc(c.name) + '</h3>' +
            '<div class="course-meta">' + (c.location ? '<span>' + App.icon('pin') + U.esc(c.location) + '</span>' : '') + (c.teacher ? '<span>' + U.esc(c.teacher) + '</span>' : '') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label>今天这节课讲什么（授课内容）</label><input class="input" data-k="content" maxlength="120" value="' + U.esc(ov.content != null ? ov.content : c.content) + '" placeholder="如：呼吸系统疾病 · 肺炎"></div>' +
        '<div class="field"><label>当天备忘 / 要带的东西 / 作业</label><textarea class="textarea" data-k="note" placeholder="如：记得带听诊器；下课前交实验报告">' + U.esc(ov.note || '') + '</textarea></div>' +
        '<label class="chip" style="align-self:flex-start;cursor:pointer"><input type="checkbox" data-k="canceled"' + (ov.canceled ? ' checked' : '') + ' style="margin-right:4px">今天停课 / 不上</label>' +
        '<p class="hint">这里只改「' + U.fmtDate(key) + '」这一天，不会影响其他周。时间、地点、课程名请在「管理课表」里改。</p>' +
        '<button class="btn btn-sm btn-ghost" data-template style="align-self:flex-start">' + App.icon('settings') + '编辑每周课表模板</button>' +
      '</div>',
      footer: [
        { label: '取消', cls: 'btn-ghost' },
        { label: '保存', cls: 'btn-primary', onClick: function (box) {
          var day = S.day(key, true);
          var prev = day.courseOverride[id] || {};
          day.courseOverride[id] = Object.assign({}, prev, {
            content: box.querySelector('[data-k="content"]').value.trim(),
            note: box.querySelector('[data-k="note"]').value.trim(),
            canceled: box.querySelector('[data-k="canceled"]').checked
          });
          S.commit();
          App.toast('已保存当天课程');
        } }
      ],
      onOpen: function (box, close) {
        var t = box.querySelector('[data-template]');
        if (t) t.addEventListener('click', function () {
          close();
          setTimeout(function () { openCourseForm({ mode: 'template', id: c.refId }); }, 180);
        });
      }
    });
  }

  /* ---------------- 课程：每周课表 ---------------- */
  function openCourseTable() {
    var key = App.ui.dateKey || U.todayKey();
    var list = S.state.courseTable.slice().sort(function (a, b) {
      return (Number(a.weekday) - Number(b.weekday)) || ((U.timeToMin(a.start) || 0) - (U.timeToMin(b.start) || 0));
    });
    var rows = list.map(function (c) {
      return '<div class="spend-item" style="align-items:center">' +
        '<span class="s-cat">周' + U.WEEKDAY_CN[c.weekday - 1] + '</span>' +
        '<span class="s-note"><b>' + U.esc(c.start) + '–' + U.esc(c.end) + '</b> ' + U.esc(c.name) + (c.location ? ' · ' + U.esc(c.location) : '') + '</span>' +
        '<button class="btn btn-sm btn-ghost" data-edit="' + U.esc(c.id) + '">编辑</button>' +
        '</div>';
    }).join('');
    var day = S.day(key, false);
    var extras = (day && day.extraCourses) || [];
    var extraRows = extras.map(function (c) {
      return '<div class="spend-item" style="align-items:center">' +
        '<span class="s-cat">当天</span>' +
        '<span class="s-note"><b>' + U.esc(c.start) + '–' + U.esc(c.end) + '</b> ' + U.esc(c.name) + (c.location ? ' · ' + U.esc(c.location) : '') + '</span>' +
        '<button class="btn btn-sm btn-ghost" data-edit-extra="' + U.esc(c.id) + '">编辑</button>' +
        '</div>';
    }).join('');

    var handle = App.openModal({
      title: '课程与课表', size: 'lg',
      html: '<div class="stack">' +
        '<div class="section-title" style="margin:0">每周固定课程</div>' +
        (rows || '<div class="empty-state"><strong>课表还是空的</strong>把每周的课加进来，每天打开就会自动显示。</div>') +
        '<button class="btn btn-primary btn-sm" data-new style="align-self:flex-start">' + App.icon('plus') + '新增固定课程</button>' +
        '<div class="divider"></div>' +
        '<div class="section-title" style="margin:0">' + U.fmtDate(key) + ' 的临时课程</div>' +
        (extraRows || '<p class="hint">补课、调课、讲座可以临时加，只影响这一天。</p>') +
        '<button class="btn btn-ghost btn-sm" data-new-extra style="align-self:flex-start">' + App.icon('plus') + '临时加一节课（仅 ' + U.fmtDate(key) + '）</button>' +
        '<p class="hint">固定课程按星期几重复显示；每天的「授课内容 / 备忘」点当天课程块单独改，不会影响其他周。</p>' +
        '</div>',
      onOpen: function (box, close) {
        box.addEventListener('click', function (e) {
          var add = e.target.closest('[data-new]');
          var addX = e.target.closest('[data-new-extra]');
          var ed = e.target.closest('[data-edit]');
          var edX = e.target.closest('[data-edit-extra]');
          if (add) { close(); setTimeout(function () { openCourseForm({ mode: 'template' }); }, 160); return; }
          if (addX) { close(); setTimeout(function () { openCourseForm({ mode: 'extra', dayKey: key }); }, 160); return; }
          if (ed) { close(); setTimeout(function () { openCourseForm({ mode: 'template', id: ed.getAttribute('data-edit') }); }, 160); return; }
          if (edX) { close(); setTimeout(function () { openCourseForm({ mode: 'extra', dayKey: key, id: edX.getAttribute('data-edit-extra') }); }, 160); }
        });
      }
    });
    return handle;
  }

  function openCourseForm(opt) {
    opt = opt || {};
    var mode = opt.mode || 'template';
    var dayKey = opt.dayKey || App.ui.dateKey;
    var existing = null;
    if (mode === 'template' && opt.id) existing = S.state.courseTable.filter(function (c) { return c.id === opt.id; })[0];
    if (mode === 'extra' && opt.id) {
      var dd = S.day(dayKey, false);
      existing = dd && dd.extraCourses.filter(function (c) { return c.id === opt.id; })[0];
    }
    var c = existing || {
      name: '', teacher: '', location: '', weekday: U.weekdayOf(dayKey),
      start: '08:00', end: '09:40', weeks: '1-16', content: '', color: App.COURSE_COLORS[0]
    };
    var wdOpts = [1, 2, 3, 4, 5, 6, 7].map(function (w) {
      return '<option value="' + w + '"' + (Number(c.weekday) === w ? ' selected' : '') + '>周' + U.WEEKDAY_CN[w - 1] + '</option>';
    }).join('');
    var title = existing ? '编辑课程' : (mode === 'extra' ? '临时加一节课' : '新增课程');

    App.openModal({
      title: title, size: 'lg',
      html: '<div class="form-grid">' +
        '<div class="field full"><label>课程名称</label><input class="input" data-c="name" maxlength="40" value="' + U.esc(c.name) + '" placeholder="如：内科学"></div>' +
        (mode === 'template' ? '<div class="field"><label>星期几</label><select class="select" data-c="weekday">' + wdOpts + '</select></div>' : '') +
        '<div class="field"><label>开始时间</label><input class="input" type="time" data-c="start" value="' + U.esc(c.start) + '"></div>' +
        '<div class="field"><label>结束时间</label><input class="input" type="time" data-c="end" value="' + U.esc(c.end) + '"></div>' +
        '<div class="field"><label>地点</label><input class="input" data-c="location" maxlength="40" value="' + U.esc(c.location || '') + '" placeholder="如：教学 A301"></div>' +
        '<div class="field"><label>老师</label><input class="input" data-c="teacher" maxlength="20" value="' + U.esc(c.teacher || '') + '" placeholder="如：张老师"></div>' +
        (mode === 'template' ? '<div class="field"><label>周次（仅作备注，不影响显示）</label><input class="input" data-c="weeks" maxlength="20" value="' + U.esc(c.weeks || '1-16') + '"></div>' : '') +
        '<div class="field"><label>颜色</label><input class="input" type="color" data-c="color" value="' + U.esc(c.color || '#2F6F62') + '" style="padding:3px 5px;height:42px"></div>' +
        '<div class="field full"><label>默认授课内容（可留空，每天再单独填）</label><input class="input" data-c="content" maxlength="120" value="' + U.esc(c.content || '') + '"></div>' +
        '</div>' +
        (existing ? '<div class="divider"></div><button class="btn btn-danger btn-sm" data-del>' + App.icon('trash') + '删除这门课</button>' : ''),
      footer: [
        { label: '取消', cls: 'btn-ghost' },
        { label: '保存', cls: 'btn-primary', onClick: function (box) {
          var get = function (f) { var el = box.querySelector('[data-c="' + f + '"]'); return el ? el.value : ''; };
          var name = get('name').trim();
          if (!name) { App.toast('课程名称不能为空', 'error'); return false; }
          var start = get('start'), end = get('end');
          if (!start || !end) { App.toast('开始时间和结束时间都要填', 'error'); return false; }
          if (U.timeToMin(end) <= U.timeToMin(start)) { App.toast('结束时间要晚于开始时间', 'error'); return false; }
          var data = {
            name: name, start: start, end: end,
            location: get('location').trim(), teacher: get('teacher').trim(),
            content: get('content').trim(), color: get('color')
          };
          if (mode === 'template') {
            data.weekday = Number(get('weekday')) || 1;
            data.weeks = get('weeks') || '1-16';
            if (existing) S.updateCourse(opt.id, data);
            else S.addCourse(data);
          } else {
            var day = S.day(dayKey, true);
            if (existing) Object.assign(existing, data);
            else day.extraCourses.push(Object.assign({ id: U.uid('c') }, data));
          }
          S.commit();
          App.toast(existing ? '已保存' : '已添加课程');
        } }
      ],
      onOpen: function (box, close) {
        var del = box.querySelector('[data-del]');
        if (del) del.addEventListener('click', function () {
          App.confirm({ title: '删除课程', text: '确定从课表删除「' + (c.name || '这门课') + '」吗？已填写的当天内容会一起清掉。', danger: true, okLabel: '删除' }).then(function (ok) {
            if (!ok) return;
            if (mode === 'template') S.removeCourse(opt.id);
            else {
              var day = S.day(dayKey, false);
              if (day) day.extraCourses = day.extraCourses.filter(function (x) { return x.id !== opt.id; });
            }
            S.commit(); close(); App.toast('已删除');
          });
        });
      }
    });
  }
})();

</script>
<script>
/* ===== js/roadmap.js ===== */
/* 晨昏日程 · 未来规划板块（大四 / 大五 / 考研 / 实习）
   经典脚本（非 ES Module），file:// 可直接打开；只写 App.views.roadmap。
   依赖：App.util / App.store / App.icon / App.openModal / App.confirm / App.toast / App.refresh */
(function () {
  'use strict';
  var App = window.App;
  if (!App) return;
  var U = App.util;

  /* ---------------- 常量 ---------------- */
  var COLORS = ['#2F6F62', '#C2703C', '#4A6FA5', '#8A5A9B', '#B0803A', '#3E7D8C'];
  var STATUS = {
    planning: { label: '规划中', cls: 'is-planning' },
    doing: { label: '进行中', cls: 'is-doing' },
    done: { label: '已完成', cls: 'is-done' }
  };
  var STATUS_ORDER = ['planning', 'doing', 'done'];
  var FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'doing', label: '进行中' },
    { key: 'planning', label: '规划中' },
    { key: 'done', label: '已完成' }
  ];
  var PRESETS = [
    { key: 'senior4', label: '大四', title: '大四 · 打基础', from: [0, 9], to: [1, 6], color: '#2F6F62', note: '专业课 + 临床见习，确定考研方向。' },
    { key: 'senior5', label: '大五', title: '大五 · 实习 + 冲刺', from: [1, 7], to: [2, 6], color: '#C2703C', note: '实习轮转与考研冲刺并行，注意时间分配。' },
    { key: 'kaoyan', label: '考研', title: '考研 · 长期准备', from: [0, 11], to: [1, 12], color: '#4A6FA5', note: '英语和西综拉长线，政治后置。' },
    { key: 'shixi', label: '实习', title: '实习 · 轮转', from: [1, 7], to: [2, 6], color: '#B0803A', note: '轮转排班 + 出科考核，记得留出复习时间。' }
  ];

  var filterKey = 'all';   /* 当前筛选 */
  var draft = {};          /* 内联里程碑草稿：stageId -> { title, date } */

  /* ---------------- 数据辅助 ---------------- */
  function road() {
    var st = App.store.state;
    if (!Array.isArray(st.roadmap)) st.roadmap = [];
    return st.roadmap;
  }
  function byId(id) {
    var arr = road(), i;
    for (i = 0; i < arr.length; i++) { if (arr[i] && arr[i].id === id) return arr[i]; }
    return null;
  }
  function msOf(r) {
    if (!r) return [];
    if (!Array.isArray(r.milestones)) r.milestones = [];
    return r.milestones;
  }
  function findMs(r, id) {
    var arr = msOf(r), i;
    for (i = 0; i < arr.length; i++) { if (arr[i] && arr[i].id === id) return arr[i]; }
    return null;
  }
  function normStatus(s) { return STATUS[s] ? s : 'planning'; }
  function colorOf(r) {
    var c = String((r && r.color) || '');
    return /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : COLORS[0];
  }
  function monthLabel(v) {
    v = String(v || '');
    return /^\d{4}-\d{2}/.test(v) ? v.slice(0, 4) + '.' + v.slice(5, 7) : v;
  }
  function rangeOf(r) {
    var txt = String((r && r.range) || '').trim();
    if (txt) return txt;
    var a = monthLabel(r && r.start), b = monthLabel(r && r.end);
    return a && b ? a + ' – ' + b : (a || b || '');
  }
  function spanMonths(r) {
    var a = /^(\d{4})-(\d{2})$/.exec(String((r && r.start) || ''));
    var b = /^(\d{4})-(\d{2})$/.exec(String((r && r.end) || ''));
    if (!a || !b) return 0;
    var n = (Number(b[1]) * 12 + Number(b[2])) - (Number(a[1]) * 12 + Number(a[2])) + 1;
    return n > 0 ? n : 0;
  }
  function nowMonth() { return U.todayKey().slice(0, 7); }
  function isNowStage(r) {
    var s = String((r && r.start) || ''), e = String((r && r.end) || ''), m = nowMonth();
    return /^\d{4}-\d{2}$/.test(s) && /^\d{4}-\d{2}$/.test(e) && s <= m && m <= e;
  }
  function axisOf(r) {
    var s = String((r && r.start) || '');
    if (/^\d{4}-\d{2}$/.test(s)) return { y: s.slice(0, 4), m: s.slice(5, 7) + '月' };
    var hit = /(\d{4})/.exec(String((r && r.range) || ''));
    return { y: hit ? hit[1] : '待定', m: '' };
  }
  function sortedStages() {
    var arr = road().filter(function (r) { return r && typeof r === 'object'; });
    arr.sort(function (a, b) {
      var ak = String(a.start || '9999-99'), bk = String(b.start || '9999-99');
      if (ak === bk) return String(a.title || '').localeCompare(String(b.title || ''));
      return ak < bk ? -1 : 1;
    });
    return arr;
  }
  function sortedMs(r) {
    var arr = msOf(r).slice();
    arr.sort(function (a, b) {
      if (!a || !b) return 0;
      var ad = String(a.date || '9999-99'), bd = String(b.date || '9999-99');
      if (ad === bd) return 0;
      return ad < bd ? -1 : 1;
    });
    return arr;
  }
  function countOf(r) {
    var ms = msOf(r), done = 0, i;
    for (i = 0; i < ms.length; i++) { if (ms[i] && ms[i].done) done++; }
    return { total: ms.length, done: done, pct: ms.length ? Math.round(done / ms.length * 100) : 0 };
  }
  function overview() {
    var arr = sortedStages(), total = 0, done = 0, doing = [], now = null, i, j;
    for (i = 0; i < arr.length; i++) {
      var ms = msOf(arr[i]);
      total += ms.length;
      for (j = 0; j < ms.length; j++) { if (ms[j] && ms[j].done) done++; }
      if (normStatus(arr[i].status) === 'doing' && doing.length < 4) doing.push(arr[i].title || '未命名阶段');
      if (!now && isNowStage(arr[i])) now = arr[i];
    }
    return { count: arr.length, total: total, done: done, doing: doing, now: now };
  }
  /* 保证老数据也都有 id（缺失时补上并静默保存，不重绘） */
  function ensureIds() {
    var arr = road(), changed = false;
    arr.forEach(function (r) {
      if (!r.id) { r.id = U.uid('r'); changed = true; }
      msOf(r).forEach(function (m) { if (m && !m.id) { m.id = U.uid('m'); changed = true; } });
    });
    if (changed) App.store.save();
  }
  function academicStart() {
    var now = new Date(), y = now.getFullYear();
    return now.getMonth() + 1 >= 9 ? y : y - 1;
  }
  function presetRange(p) {
    var base = academicStart();
    return { start: (base + p.from[0]) + '-' + U.pad(p.from[1]), end: (base + p.to[0]) + '-' + U.pad(p.to[1]) };
  }
  function filterBy(key, arr) {
    if (key === 'all') return arr;
    return arr.filter(function (r) { return normStatus(r.status) === key; });
  }
  function filterLabel(key) {
    for (var i = 0; i < FILTERS.length; i++) { if (FILTERS[i].key === key) return FILTERS[i].label; }
    return '全部';
  }
  function pctOf(done, total) { return total ? Math.round(done / total * 100) : 0; }

  /* ---------------- HTML 片段 ---------------- */
  function headHTML(ov) {
    return '<div class="rm-head">' +
      '<div class="rm-head-main">' +
        '<h2 class="rm-h2">' + App.icon('target') + '<span>未来规划</span></h2>' +
        '<p class="rm-sub">把「大四 / 大五 / 考研 / 实习」拆成阶段，再拆成一个个能打勾的里程碑。</p>' +
      '</div>' +
      (ov.count ? '<div class="rm-head-actions">' +
        '<button type="button" class="btn btn-primary rm-new-btn" data-rm="new-stage">' + App.icon('plus') + '<span>新建阶段</span></button>' +
      '</div>' : '') +
    '</div>';
  }

  function statsHTML(ov) {
    var p = pctOf(ov.done, ov.total);
    return '<div class="rm-stats">' +
      '<div class="rm-stat">' +
        '<span class="rm-stat-k">阶段</span>' +
        '<span class="rm-stat-v">' + ov.count + '<small>个</small></span>' +
        '<span class="rm-stat-foot">按开始时间排列</span>' +
      '</div>' +
      '<div class="rm-stat">' +
        '<span class="rm-stat-k">里程碑完成</span>' +
        '<span class="rm-stat-v">' + ov.done + '<small>/ ' + ov.total + '</small></span>' +
        '<div class="progress rm-stat-bar"><i style="width:' + p + '%"></i></div>' +
      '</div>' +
      '<div class="rm-stat rm-stat-wide">' +
        '<span class="rm-stat-k">进行中的阶段</span>' +
        (ov.doing.length
          ? '<span class="rm-stat-names">' + ov.doing.map(function (t) { return '<span class="rm-tag">' + U.esc(t) + '</span>'; }).join('') + '</span>'
          : '<span class="rm-stat-empty">暂无，点阶段上的状态徽章就能切换。</span>') +
        (ov.now ? '<span class="rm-stat-foot">' + App.icon('clock') + '本月正处于「' + U.esc(ov.now.title || '未命名阶段') + '」</span>' : '') +
      '</div>' +
    '</div>';
  }

  function segHTML(arr) {
    var counts = { all: arr.length, planning: 0, doing: 0, done: 0 };
    arr.forEach(function (r) { counts[normStatus(r.status)]++; });
    return '<div class="seg rm-seg" role="group" aria-label="筛选阶段">' + FILTERS.map(function (f) {
      return '<button type="button" class="' + (filterKey === f.key ? 'active' : '') + '" data-rm="filter" data-key="' + f.key + '">' +
        U.esc(f.label) + '<span class="rm-seg-n">' + counts[f.key] + '</span></button>';
    }).join('') + '</div>';
  }

  function msItemHTML(r, m) {
    if (!m) return '';
    var sid = U.esc(r.id || '');
    var mid = U.esc(m.id || '');
    var h = '<li class="rm-ms-item' + (m.done ? ' is-done' : '') + '">';

  function emptyHTML() {
    return '<div class="rm-empty">' +
      '<div class="rm-empty-ico">' + App.icon('target') + '</div>' +
      '<h3>还没有未来规划</h3>' +
      '<p>把大四、大五、考研、实习这些长期目标拆成阶段，再把阶段拆成一个个能打勾的里程碑，进度就会慢慢跑起来。</p>' +

  function bodyHTML(arr, shown) {
    var h = statsHTML(overview());
    h += '<div class="rm-toolbar">' + segHTML(arr) + '<span class="rm-toolbar-hint">按开始时间排序 · 点状态徽章可切换</span></div>';
    if (!shown.length) {
      h += '<div class="rm-none">' + App.icon('spark') + '<span>没有「' + U.esc(filterLabel(filterKey)) + '」的阶段。</span>' +

  /* ---------------- 渲染 ---------------- */
  function render(el) {
    if (!el) return;
    ensureIds();
    var arr = sortedStages();
    var ov = overview();
    var shown = filterBy(filterKey, arr);
    var html = '<div class="page rm-page">' + headHTML(ov) + (arr.length ? bodyHTML(arr, shown) : emptyHTML()) + '</div>';
    el.innerHTML = html;
    el.onclick = onViewClick;
    el.onchange = onViewChange;
    el.oninput = onViewInput;
    el.onkeydown = onViewKey;
    restoreFocus(el);
  }

  function restoreFocus(el) {
    var f = App.ui && App.ui.roadmapFocus;
    if (!f || !el.querySelector) return;
    App.ui.roadmapFocus = null;
    var target = el.querySelector('.rm-stage[data-stage="' + String(f.id).replace(/"/g, '') + '"] [data-rm="' + (f.field || 'ms-title') + '"]');
    if (target && target.focus) { try { target.focus(); } catch (e) { /* ignore */ } }
  }

  /* ---------------- 事件（全部绑定在渲染出的 #view 上，不碰 document/window） ---------------- */
  function onViewClick(e) {
    var t = e.target;
    if (t && t.closest) {
      var f = t.closest('[data-rm]');
      if (f) {
        var act = f.getAttribute('data-rm');
        var id = f.getAttribute('data-id');
        var sid = f.getAttribute('data-stage');
        if (act === 'new-stage') { e.preventDefault(); openStageModal(null); return; }
        if (act === 'load-sample') { loadSample(); return; }
        if (act === 'filter') { filterKey = f.getAttribute('data-key') || 'all'; App.refresh(); return; }
        if (act === 'edit') { var st = byId(id); if (st) openStageModal(st); return; }
        if (act === 'del') { askDeleteStage(id); return; }
        if (act === 'cycle') { cycleStatus(id); return; }
        if (act === 'ms-add') { addMilestone(id); return; }
        if (act === 'ms-del') { askDeleteMs(sid, id); return; }
        if (act === 'ms-edit') { openMsModal(sid, id); return; }
      }
    }
    /* 点内联输入框所在空白区域不做事 */
  }

  function onViewChange(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    if (t.getAttribute('data-rm') === 'ms-toggle') {
      var r = byId(t.getAttribute('data-stage'));
      var m = r ? findMs(r, t.getAttribute('data-id')) : null;
      if (!m) return;
      m.done = !!t.checked;
      App.store.commit();
    }
  }

  function onViewInput(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-rm');
    if (act !== 'ms-title' && act !== 'ms-date') return;
    var sid = t.getAttribute('data-id');
    if (!sid) return;
    var d = draft[sid] || (draft[sid] = {});
    if (act === 'ms-title') d.title = t.value;
    else d.date = t.value;
  }

  function onViewKey(e) {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-rm');
    if (act === 'ms-title' || act === 'ms-date') {
      e.preventDefault();
      addMilestone(t.getAttribute('data-id'));
    }
  }

  /* ---------------- 数据操作 ---------------- */
  function addMilestone(sid) {
    var r = byId(sid);
    if (!r) return;
    var d = draft[sid] || {};
    var title = String(d.title || '').trim();
    if (!title) {
      App.toast('先写一下里程碑的标题', 'error');
      App.ui.roadmapFocus = { id: sid, field: 'ms-title' };
      App.refresh();
      return;
    }
    msOf(r).push({ id: U.uid('m'), title: title, date: String(d.date || '').trim(), done: false, note: '' });
    delete draft[sid];
    App.ui.roadmapFocus = { id: sid, field: 'ms-title' };
    App.store.commit();
    App.toast('已添加里程碑');
  }

  function cycleStatus(id) {
    var r = byId(id);
    if (!r) return;
    var cur = normStatus(r.status);
    r.status = STATUS_ORDER[(STATUS_ORDER.indexOf(cur) + 1) % STATUS_ORDER.length];
    App.store.commit();
    App.toast('阶段状态：' + STATUS[r.status].label);
  }

  function askDeleteStage(id) {
    var r = byId(id);
    if (!r) return;
    App.confirm({
      title: '删除阶段',
      text: '「' + (r.title || '未命名阶段') + '」和它下面的 ' + msOf(r).length + ' 个里程碑都会被删除，且无法撤销。',
      okLabel: '删除', danger: true
    }).then(function (ok) {
      if (!ok) return;
      var arr = road();
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] === r) { arr.splice(i, 1); break; }
      }
      delete draft[id];
      App.store.commit();
      App.toast('已删除阶段');
    });
  }

  function askDeleteMs(sid, msId) {
    var r = byId(sid);
    var m = r ? findMs(r, msId) : null;
    if (!r || !m) return;
    App.confirm({
      title: '删除里程碑',
      text: '删除「' + (m.title || '未命名里程碑') + '」？',
      okLabel: '删除', danger: true
    }).then(function (ok) {
      if (!ok) return;
      r.milestones = msOf(r).filter(function (x) { return x !== m; });
      App.store.commit();
      App.toast('已删除里程碑');
    });
  }

  /* ---------------- 弹窗：阶段 ---------------- */
  function val(box, name) {
    var el = box.querySelector('[data-f="' + name + '"]');
    return el ? String(el.value || '').trim() : '';
  }
  function setVal(box, name, v) {
    var el = box.querySelector('[data-f="' + name + '"]');
    if (el) el.value = v;
  }
  function colorsHTML(r) {
    var cur = colorOf(r);
    var sw = COLORS.map(function (c) {
      return '<button type="button" class="rm-swatch' + (c === cur ? ' is-on' : '') + '" data-color="' + c + '" style="--sw:' + c + '" aria-label="颜色 ' + c + '"></button>';
    }).join('');
    return '<div class="rm-colors" data-colors data-value="' + U.esc(cur) + '">' + sw +

  function statusOptions(cur) {
    return STATUS_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + STATUS[k].label + '</option>';
    }).join('');

  function msRowHTML(m) {

    return '<div class="rm-mrow" data-mrow data-mid="' + U.esc(m.id || '') + '">' +
      '<label class="rm-mcheck" title="标记为已完成"><input type="checkbox" data-mf="done"' + (m.done ? ' checked' : '') + '><span class="rm-check-box">' + App.icon('check') + '</span></label>' +
      '<input class="input rm-mtitle" data-mf="title" type="text" maxlength="60" placeholder="里程碑标题" value="' + U.esc(m.title || '') + '">' +
      '<input class="input rm-mmonth" data-mf="date" type="month" value="' + U.esc(m.date || '') + '" data-orig="' + U.esc(m.date || '') + '">' +

      '</div>';

    if (!ms.length) return '<p class="rm-msedit-empty">还没有里程碑，点「加一条」开始拆解。</p>' + msRowHTML({});

  function openStageModal(stage) {
    var isNew = !stage;
    var r = stage || { title: '', start: '', end: '', range: '', color: COLORS[0], status: 'planning', note: '', milestones: [] };
    var presets = PRESETS.map(function (p) {
      return '<button type="button" class="chip rm-preset" data-preset="' + p.key + '">' + U.esc(p.label) + '</button>';
    }).join('');

    if (isNew) {
      h += '<div class="rm-presets-wrap"><label class="rm-flabel">快捷预设</label><div class="rm-presets">' + presets + '</div>' +
        '<p class="hint">点一下自动填好标题与起止时间，再按需微调。</p></div>';
    }
    h += '<div class="field"><label for="rmStageTitle">阶段标题</label>' +

      '<div class="field"><label for="rmStageStart">开始（年-月）</label><input class="input" id="rmStageStart" data-f="start" type="month" value="' + U.esc(r.start || '') + '"></div>' +

      '<p class="hint">留空时会用上面两个月份自动拼出来，想写「大四上 / 寒假」也行。</p></div>';

    });
