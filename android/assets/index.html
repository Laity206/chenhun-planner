  function bindStageModal(box) {
    box.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var pre = t.closest('[data-preset]');
      if (pre) { applyPreset(box, pre.getAttribute('data-preset')); return; }
      var sw = t.closest('[data-color]');
      if (sw) {
        var wrap = box.querySelector('[data-colors]');
        var c = sw.getAttribute('data-color');
        if (wrap) wrap.setAttribute('data-value', c);
        Array.prototype.forEach.call(box.querySelectorAll('[data-color]'), function (b) { b.classList.remove('is-on'); });
        sw.classList.add('is-on');
        var ci = box.querySelector('[data-f="color"]');
        if (ci) ci.value = c;
        return;
      }
      var addRow = t.closest('[data-ms-add-row]');
      if (addRow) {
        var rowsBox = box.querySelector('[data-ms-rows]');
        if (!rowsBox) return;
        var hint = rowsBox.querySelector('.rm-msedit-empty');
        if (hint && hint.parentNode) hint.parentNode.removeChild(hint);
        rowsBox.insertAdjacentHTML('beforeend', msRowHTML({}));
        var last = rowsBox.lastElementChild;
        if (last) {
          var inp = last.querySelector('[data-mf="title"]');
          if (inp && inp.focus) inp.focus();
        }
        return;
      }
      var del = t.closest('[data-mf="del"]');
      if (del) {
        var rowEl = del.closest('[data-mrow]');
        if (!rowEl || !rowEl.parentNode) return;
        rowEl.parentNode.removeChild(rowEl);
        if (!box.querySelector('[data-mrow]')) {
          var rowsBox2 = box.querySelector('[data-ms-rows]');
          if (rowsBox2) rowsBox2.insertAdjacentHTML('beforeend', msRowHTML({}));
        }
      }
    });
    box.addEventListener('change', function (e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      var f = t.getAttribute('data-f');
      if (f === 'start' || f === 'end') {
        var rg = box.querySelector('[data-f="range"]');
        if (!rg) return;
        var a = val(box, 'start'), b = val(box, 'end');
        var al = monthLabel(a), bl = monthLabel(b);
        rg.value = al && bl ? al + ' – ' + bl : (al || bl || '');
        return;
      }
      if (f === 'color') {
        var wrap = box.querySelector('[data-colors]');
        var v = String(t.value || '');
        if (wrap) wrap.setAttribute('data-value', v || COLORS[0]);
        Array.prototype.forEach.call(box.querySelectorAll('[data-color]'), function (btn) {
          btn.classList.toggle('is-on', btn.getAttribute('data-color') === v);
        });
      }
    });
  }

  function applyPreset(box, key) {
    var p = null, i;
    for (i = 0; i < PRESETS.length; i++) { if (PRESETS[i].key === key) p = PRESETS[i]; }
    if (!p) return;
    var rg = presetRange(p);
    setVal(box, 'title', p.title);
    setVal(box, 'start', rg.start);
    setVal(box, 'end', rg.end);
    setVal(box, 'range', monthLabel(rg.start) + ' – ' + monthLabel(rg.end));
    var noteEl = box.querySelector('[data-f="note"]');
    if (noteEl && !String(noteEl.value || '').trim()) noteEl.value = p.note;
    var wrap = box.querySelector('[data-colors]');
    if (wrap) wrap.setAttribute('data-value', p.color);
    Array.prototype.forEach.call(box.querySelectorAll('[data-color]'), function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-color') === p.color);
    });
    var ci = box.querySelector('[data-f="color"]');
    if (ci) ci.value = p.color;
    Array.prototype.forEach.call(box.querySelectorAll('[data-preset]'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-preset') === key);
    });
  }

  function saveStage(box, r, isNew) {
    var title = val(box, 'title');
    if (!title) { App.toast('阶段标题不能为空', 'error'); return false; }
    var start = val(box, 'start') || String(r.start || '');
    var end = val(box, 'end') || String(r.end || '');
    var rangeTxt = val(box, 'range');
    if (!rangeTxt) {
      var al = monthLabel(start), bl = monthLabel(end);
      rangeTxt = al && bl ? al + ' – ' + bl : (al || bl || '');
    }
    var colorWrap = box.querySelector('[data-colors]');
    var color = colorWrap ? String(colorWrap.getAttribute('data-value') || '') : '';
    if (!/^#[0-9a-fA-F]{3,8}$/.test(color)) color = COLORS[0];
    var status = normStatus(val(box, 'status'));
    var noteEl = box.querySelector('[data-f="note"]');
    var note = noteEl ? String(noteEl.value || '').trim() : '';
    var rows = box.querySelectorAll('[data-mrow]');
    var ms = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var tEl = row.querySelector('[data-mf="title"]');
      var mTitle = tEl ? String(tEl.value || '').trim() : '';
      if (!mTitle) continue;
      var dEl = row.querySelector('[data-mf="date"]');
      var mDate = dEl ? String(dEl.value || '').trim() : '';
      if (!mDate && dEl) mDate = String(dEl.getAttribute('data-orig') || '');
      var nEl = row.querySelector('[data-mf="note"]');
      var ckEl = row.querySelector('[data-mf="done"]');
      ms.push({
        id: row.getAttribute('data-mid') || U.uid('m'),
        title: mTitle,
        date: mDate,
        note: nEl ? String(nEl.value || '').trim() : '',
        done: !!(ckEl && ckEl.checked)
      });
    }
    if (isNew) {
      road().push({
        id: U.uid('r'), title: title, range: rangeTxt, start: start, end: end,
        color: color, status: status, note: note, milestones: ms
      });
      filterKey = 'all';
    } else {
      r.title = title; r.range = rangeTxt; r.start = start; r.end = end;
      r.color = color; r.status = status; r.note = note; r.milestones = ms;
    }
    App.store.commit();
    App.toast(isNew ? '已新建阶段' : '已保存阶段');
    return true;
  }

  /* ---------------- 弹窗：单个里程碑 ---------------- */
  function openMsModal(stageId, msId) {
    var r = byId(stageId);
    var m = r ? findMs(r, msId) : null;
    if (!r || !m) return;
    var h = '<div class="rm-form">' +
      '<div class="field"><label for="rmMsTitle">里程碑</label>' +
        '<input class="input" id="rmMsTitle" data-f="title" type="text" maxlength="60" placeholder="要完成的事" value="' + U.esc(m.title || '') + '"></div>' +
      '<div class="form-grid">' +
        '<div class="field"><label for="rmMsDate">时间（年-月）</label>' +
          '<input class="input" id="rmMsDate" data-f="date" type="month" value="' + U.esc(m.date || '') + '" data-orig="' + U.esc(m.date || '') + '"></div>' +
        '<div class="field"><label>完成情况</label>' +
          '<label class="rm-switch"><input type="checkbox" data-f="done"' + (m.done ? ' checked' : '') + '>' +
            '<span class="rm-check-box">' + App.icon('check') + '</span><em>' + (m.done ? '已完成' : '未完成') + '</em></label></div>' +
      '</div>' +
      '<div class="field"><label for="rmMsNote">备注</label>' +
        '<textarea class="textarea" id="rmMsNote" data-f="note" rows="3" maxlength="200" placeholder="可选，记一下为什么重要 / 卡在哪里">' + U.esc(m.note || '') + '</textarea></div>' +
    '</div>';
    App.openModal({
      title: '编辑里程碑',
      html: h,
      size: 'sm',
      footer: [
        { label: '取消', cls: 'btn-ghost' },
        {
          label: '保存', cls: 'btn-primary',
          onClick: function (box) {
            var t = val(box, 'title');
            if (!t) { App.toast('里程碑标题不能为空', 'error'); return false; }
            m.title = t;
            var dEl = box.querySelector('[data-f="date"]');
            var dv = dEl ? String(dEl.value || '').trim() : '';
            m.date = dv || (dEl ? String(dEl.getAttribute('data-orig') || '') : '');
            m.note = val(box, 'note');
            var ck = box.querySelector('[data-f="done"]');
            m.done = !!(ck && ck.checked);
            App.store.commit();
            App.toast('已保存里程碑');
            return true;
          }
        }
      ],
      onOpen: function (box) {
        box.addEventListener('change', function (e) {
          var t = e.target;
          if (!t || t.getAttribute('data-f') !== 'done') return;
          var em = box.querySelector('.rm-switch em');
          if (em) em.textContent = t.checked ? '已完成' : '未完成';
        });
      }
    });
  }

  /* ---------------- 挂载 ---------------- */
  App.views = App.views || {};
  App.views.roadmap = { render: render };
})();

</script>
<script>
/* ===== js/share.js ===== */
/* 晨昏日程 · 数据板块：分享码同步、备份导入导出、预算与主题设置
   经典脚本（非 ES Module），file:// 可直接打开。
   挂载：App.share.encode / App.share.decode / App.views.data */
(function () {
  'use strict';
  var App = window.App;
  if (!App) return;
  var U = App.util;
  var SHARE = (App.share = App.share || {});

  SHARE.VERSION = 'CHX1';       // gzip 压缩版：CHX1. + base64url(gzip(utf8(JSON)))
  SHARE.RAW_VERSION = 'CHX1R';  // 降级版：CHX1R. + base64url(utf8(JSON))

  /* ==================================================================
     一、分享码编解码
     ================================================================== */

  function bytesToBase64url(bytes) {
    var bin = '', i, step = 0x2000;
    for (i = 0; i < bytes.length; i += step) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    var b64 = window.btoa ? window.btoa(bin) : btoa(bin);
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function base64urlToBytes(str) {
    var s = String(str || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin;
    try {
      bin = window.atob ? window.atob(s) : atob(s);
    } catch (e) {
      throw new Error('分享码内容损坏，请确认是否完整复制');
    }
    var out = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function supportsZip() {
    return typeof CompressionStream === 'function' &&
      typeof DecompressionStream === 'function' &&
      typeof ReadableStream === 'function';
  }

  function bytesToStream(bytes) {
    return new ReadableStream({
      start: function (controller) { controller.enqueue(bytes); controller.close(); }
    });
  }

  function concatChunks(chunks) {
    var total = 0, i, off = 0;
    for (i = 0; i < chunks.length; i++) total += chunks[i].length;
    var out = new Uint8Array(total);
    for (i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
    return out;
  }

  function readAll(stream) {
    return new Promise(function (resolve, reject) {
      if (!stream || typeof stream.getReader !== 'function') {
        reject(new Error('当前浏览器不支持压缩流'));
        return;
      }
      var reader = stream.getReader();
      var chunks = [];
      function pump() {
        reader.read().then(function (r) {
          if (r.done) { resolve(concatChunks(chunks)); return; }
          if (r.value && r.value.length) chunks.push(r.value);
          pump();
        }, function (err) { reject(err); });
      }
      pump();
    });
  }

  function gzipBytes(bytes) {
    if (!supportsZip()) return Promise.resolve(null);
    try {
      return readAll(bytesToStream(bytes).pipeThrough(new CompressionStream('gzip'))).then(function (out) {
        return out && out.length ? out : null;
      }, function () { return null; });
    } catch (e) {
      return Promise.resolve(null);
    }
  }

  function gunzipBytes(bytes) {
    if (!supportsZip()) {
      return Promise.reject(new Error('当前浏览器不支持解压这类分享码，请换新版 Chrome / Edge / Safari 打开'));
    }
    try {
      return readAll(bytesToStream(bytes).pipeThrough(new DecompressionStream('gzip'))).then(null, function () {
        throw new Error('分享码解压失败，可能复制不完整');
      });
    } catch (e) {
      return Promise.reject(new Error('分享码解压失败，可能复制不完整'));
    }
  }

  /* 从粘贴的文本里提取分享码：允许前后有说明文字、换行、空格，
     甚至聊天软件在码中间插入换行。只取合法的 base64url 片段。 */
  function extractCode(code) {
    var s = String(code == null ? '' : code).replace(/\s+/g, '');
    if (!s) return null;
    var m = /CHX1R\.([A-Za-z0-9_\-]+)/.exec(s);
    if (m) return { raw: true, payload: m[1] };
    m = /CHX1\.([A-Za-z0-9_\-]+)/.exec(s);
    if (m) return { raw: false, payload: m[1] };
    return null;
  }

  function cleanState(obj) {
    if (!obj || typeof obj !== 'object' || Object.prototype.toString.call(obj) === '[object Array]') {
      throw new Error('分享码内容不是有效的日程数据');
    }
    if (!obj.settings && !obj.days) {
      throw new Error('分享码内容不像晨昏日程的数据');
    }
    var st;
    try {
      st = App.store.normalize(obj);
    } catch (e) {
      throw new Error('分享码里的数据有损坏，无法导入');
    }
    // 去掉非法日期键，避免脏数据导致别的板块渲染异常
    Object.keys(st.days).forEach(function (k) {
      var d = st.days[k];
      if (!U.validKey(k) || !d || typeof d !== 'object' || !d.tasks || !d.expenses) delete st.days[k];
    });
    return st;
  }

  /* 非中文异常统一转成用户看得懂的提示 */
  function friendlyError(e) {
    var m = e && e.message ? String(e.message) : '';
    if (/[\u4e00-\u9fa5]/.test(m)) return e;
    return new Error('分享码里的数据有损坏，无法导入');
  }

  function parseJsonState(json) {
    var obj;
    try {
      obj = JSON.parse(json);
    } catch (e) {
      throw new Error('分享码里的数据不是合法 JSON，可能没有完整复制');
    }
    return cleanState(obj);
  }

  /* 生成分享码：App.share.encode(state?) -> Promise<string> */
  SHARE.encode = function (state) {
    var st = state || App.store.state;
    var json;
    try {
      json = JSON.stringify(st);
    } catch (e) {
      return Promise.reject(new Error('数据无法序列化，生成分享码失败'));
    }
    if (!json) return Promise.reject(new Error('当前没有可分享的数据'));
    var bytes = new TextEncoder().encode(json);
    return gzipBytes(bytes).then(function (gz) {
      if (gz) return SHARE.VERSION + '.' + bytesToBase64url(gz);
      return SHARE.RAW_VERSION + '.' + bytesToBase64url(bytes);
    });
  };

  /* 导入分享码：App.share.decode(code) -> Promise<state> */
  SHARE.decode = function (code) {
    var found = extractCode(code);
    if (!found) {
      var s = String(code == null ? '' : code).replace(/\s+/g, '');
      if (!s) return Promise.reject(new Error('请先粘贴分享码'));
      return Promise.reject(new Error('分享码格式不对：应以 CHX1. 或 CHX1R. 开头'));
    }
    var payload;
    try {
      payload = base64urlToBytes(found.payload);
    } catch (e) {
      return Promise.reject(e instanceof Error ? e : new Error('分享码解析失败'));
    }
    if (found.raw) {
      var rawJson;
      try {
        rawJson = new TextDecoder('utf-8').decode(payload);
      } catch (e2) {
        return Promise.reject(new Error('分享码内容损坏，请确认是否完整复制'));
      }
      return Promise.resolve().then(function () { return parseJsonState(rawJson); }).catch(function (e) {
        return Promise.reject(friendlyError(e));
      });
    }
    return gunzipBytes(payload).then(function (bytes) {
      return parseJsonState(new TextDecoder('utf-8').decode(bytes));
    }).catch(function (e) {
      return Promise.reject(friendlyError(e));
    });
  };

  /* ==================================================================
     二、统计与摘要
     ================================================================== */

  function statsOf(st) {
    st = st && st.days ? st : App.store.defaults();
    var out = {
      days: 0, tasks: 0, done: 0, expenses: 0, spent: 0,
      roadmap: 0, courses: 0, firstKey: '', lastKey: ''
    };
    var keys = Object.keys(st.days || {}).sort();
    keys.forEach(function (k) {
      if (!U.validKey(k)) return;
      var d = st.days[k];
      if (!d || !d.tasks || !d.expenses) return;
      out.days++;
      if (!out.firstKey) out.firstKey = k;
      out.lastKey = k;
      out.tasks += d.tasks.length;
      out.expenses += d.expenses.length;
      d.tasks.forEach(function (t) { if (t && t.done) out.done++; });
      out.spent += U.sum(d.expenses, function (e) { return e && e.amount; });
    });
    out.roadmap = (st.roadmap || []).length;
    out.courses = (st.courseTable || []).length;
    return out;
  }
  SHARE.stats = statsOf;

  function summaryHtml(st) {
    var info = statsOf(st);
    var rate = info.tasks ? Math.round((info.done / info.tasks) * 100) : 0;
    var rows = [
      ['有记录的天数', info.days + ' 天'],
      ['任务', info.tasks + ' 个（已完成 ' + info.done + ' 个，' + rate + '%）'],
      ['开销记录', info.expenses + ' 笔' + (info.spent ? ' · 共 ' + U.money(info.spent) : '')],
      ['长期规划', info.roadmap + ' 条 · 固定课程 ' + info.courses + ' 门']
    ];
    if (info.days) rows.push(['日期范围', info.firstKey + ' ~ ' + info.lastKey]);
    var name = st && st.settings && st.settings.name ? st.settings.name : '';
    if (name) rows.unshift(['昵称', U.esc(name)]);
    return '<div class="data-summary">' + rows.map(function (r) {
      return '<div class="data-summary-row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>';
    }).join('') + '</div>';
  }
  SHARE.summaryHtml = summaryHtml;

  /* ==================================================================
     三、渲染辅助
     ================================================================== */

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmtWhen(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (!d || isNaN(d.getTime())) return '—';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function themeLabel(t) {
    if (t === 'light') return '浅色';
    if (t === 'dark') return '深色';
    return '跟随系统';
  }

  function reasonLabel(r) {
    if (r === 'import') return '导入前';
    if (r === 'reset') return '重置前';
    if (r === 'restore') return '恢复前';
    return '自动备份';
  }

  function statBox(value, label) {
    return '<div class="data-stat"><b>' + U.esc(String(value)) + '</b><span>' + U.esc(label) + '</span></div>';
  }

  function themeButton(value, label, current) {
    return '<button type="button" class="' + (current === value ? 'active' : '') +
      '" data-act="set-theme" data-theme-value="' + value + '">' + label + '</button>';
  }

  function readBackupMeta() {
    var ls = null;
    try { ls = window.localStorage || null; } catch (e) { ls = null; }
    if (!ls) return null;
    try {
      var raw = ls.getItem(App.BACKUP_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || !obj.state) return null;
      return { at: obj.at || '', reason: obj.reason || '' };
    } catch (e) {
      return null;
    }
  }

  function toNumber(value, fallback) {
    var n = parseFloat(String(value == null ? '' : value).replace(/[^\d.\-]/g, ''));
    if (!isFinite(n) || n < 0) return fallback;
    return Math.round(U.clamp(n, 0, 10000000) * 100) / 100;
  }

  /* ==================================================================
     四、动作
     ================================================================== */

  function applyState(st) {
    App.store.snapshotBackup('import');
    App.store.state = App.store.normalize(st);
    if (App.applyTheme) App.applyTheme();
    App.store.commit();
  }

  function openConfirm(title, html, okLabel, danger) {
    return new Promise(function (resolve) {
      var settled = false;
      App.openModal({
        title: title,
        html: html,
        size: 'sm',
        footer: [
          { label: '取消', cls: 'btn-ghost' },
          {
            label: okLabel || '确定',
            cls: danger ? 'btn-danger' : 'btn-primary',
            onClick: function () { settled = true; resolve(true); }
          }
        ],
        onClose: function () { if (!settled) resolve(false); }
      });
    });
  }

  function confirmImport(st, from) {
    var html = '<p class="confirm-text">将用' + U.esc(from || '这份数据') +
      '覆盖当前设备上的数据。当前数据会先自动备份，之后可以用「恢复上次备份」找回。</p>' + summaryHtml(st);
    return openConfirm('确认导入', html, '覆盖导入', false);
  }

  function genShare(viewEl) {
    var btn = viewEl.querySelector('[data-act="gen-share"]');
    var ta = viewEl.querySelector('[data-share-code]');
    var count = viewEl.querySelector('[data-share-count]');
    var fmt = viewEl.querySelector('[data-share-format]');
    if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
    App.share.encode().then(function (code) {
      if (ta) {
        ta.value = code;
        try { ta.focus(); ta.select(); } catch (e) { /* ignore */ }
      }
      if (count) count.textContent = code.length + ' 字符';
      if (fmt) fmt.textContent = code.indexOf(SHARE.RAW_VERSION + '.') === 0
        ? '未压缩（当前浏览器不支持 gzip，码较长）'
        : '已压缩（gzip）';
      App.toast(code.length > 6000 ? '分享码较长，建议改用文件备份' : '分享码已生成');
    }).catch(function (err) {
      App.toast((err && err.message) || '生成分享码失败', 'error');
    }).then(function () {
      if (btn) { btn.disabled = false; btn.textContent = '生成分享码'; }
    });
  }

  function copyShare(viewEl) {
    var ta = viewEl.querySelector('[data-share-code]');
    var code = ta && ta.value ? ta.value : '';
    if (!code) { App.toast('请先生成分享码', 'error'); return; }
    U.copy(code).then(function () {
      App.toast('分享码已复制');
    }, function () {
      if (ta) { try { ta.focus(); ta.select(); } catch (e) { /* ignore */ } }
      App.toast('复制失败，已全选，请手动复制', 'error');
    });
  }

  function importShare(viewEl) {
    var ta = viewEl.querySelector('[data-paste]');
    var code = ta ? ta.value : '';
    if (!code || !code.replace(/\s+/g, '')) { App.toast('请先粘贴分享码', 'error'); return; }
    App.share.decode(code).then(function (st) {
      return confirmImport(st, '这份分享码').then(function (ok) {
        if (!ok) return;
        applyState(st);
        App.toast('已导入分享码里的数据');
      });
    }).catch(function (err) {
      App.toast((err && err.message) || '分享码解析失败', 'error');
    });
  }

  function exportJson() {
    try {
      var text = JSON.stringify(App.store.state, null, 2);
      U.download('chenxi-planner-' + U.todayKey() + '.json', text, 'application/json;charset=utf-8');
      App.toast('备份文件已导出');
    } catch (e) {
      App.toast('导出失败：' + (e.message || '未知错误'), 'error');
    }
  }

  function pickFile(viewEl) {
    var input = viewEl.querySelector('[data-file]');
    if (input) input.click();
  }

  function handleFile(file) {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { App.toast('文件太大（超过 8MB）', 'error'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '');
      var obj;
      try {
        obj = JSON.parse(text);
      } catch (e) {
        App.toast('不是合法的 JSON 文件', 'error');
        return;
      }
      if (obj && !obj.settings && !obj.days && obj.state) obj = obj.state;
      if (!obj || typeof obj !== 'object' ||
        Object.prototype.toString.call(obj) === '[object Array]' ||
        (!obj.settings && !obj.days)) {
        App.toast('文件内容不是日程数据', 'error');
        return;
      }
      var st;
      try {
        st = App.store.normalize(obj);
        Object.keys(st.days).forEach(function (k) {
          var d = st.days[k];
          if (!U.validKey(k) || !d || !d.tasks || !d.expenses) delete st.days[k];
        });
      } catch (e) {
        App.toast('文件里的数据有损坏，无法导入', 'error');
        return;
      }
      confirmImport(st, '这个文件').then(function (ok) {
        if (!ok) return;
        applyState(st);
        App.toast('已从文件导入数据');
      });
    };
    reader.onerror = function () { App.toast('文件读取失败', 'error'); };
    reader.readAsText(file, 'utf-8');
  }

  function restoreBackupAction() {
    var meta = readBackupMeta();
    if (!meta) { App.toast('暂无自动备份', 'error'); return; }
    // 注意：这里不能先 snapshotBackup，否则会把要恢复的那份备份覆盖掉
    App.confirm({
      title: '恢复上次备份？',
      text: '将恢复 ' + fmtWhen(meta.at) + ' 的自动备份（' + reasonLabel(meta.reason) + '）。\n恢复后当前数据会被覆盖。',
      okLabel: '恢复备份'
    }).then(function (ok) {
      if (!ok) return;
      if (App.store.restoreBackup()) {
        if (App.applyTheme) App.applyTheme();
        App.toast('已恢复备份');
      } else {
        App.toast('恢复备份失败', 'error');
      }
    });
  }

  function saveSettings(viewEl) {
    var s = App.store.state.settings;
    var nameEl = viewEl.querySelector('[data-setting="name"]');
    var goalEl = viewEl.querySelector('[data-setting="saveGoal"]');
    var dailyEl = viewEl.querySelector('[data-setting="dailyBudget"]');
    var monthEl = viewEl.querySelector('[data-setting="monthBudget"]');
    if (nameEl) s.name = String(nameEl.value == null ? '' : nameEl.value).trim().slice(0, 20);
    if (goalEl) s.saveGoal = String(goalEl.value == null ? '' : goalEl.value).trim().slice(0, 40);
    if (dailyEl) s.dailyBudget = toNumber(dailyEl.value, Number(s.dailyBudget) || 0);
    if (monthEl) s.monthBudget = toNumber(monthEl.value, 0);
    App.store.commit();
    App.toast('设置已保存');
  }

  function setTheme(mode, viewEl) {
    if (mode !== 'auto' && mode !== 'light' && mode !== 'dark') return;
    App.store.state.settings.theme = mode;
    App.store.save();
    if (App.applyTheme) App.applyTheme();
    var seg = viewEl.querySelector('.data-seg');
    if (seg) {
      Array.prototype.forEach.call(seg.querySelectorAll('button[data-theme-value]'), function (b) {
        var on = b.getAttribute('data-theme-value') === mode;
        if (on) b.classList.add('active'); else b.classList.remove('active');
      });
    }
    var hint = viewEl.querySelector('[data-theme-hint]');
    if (hint) hint.textContent = '当前：' + themeLabel(mode) + '。切换后立即保存。';
    App.toast('主题已切换为' + themeLabel(mode));
  }

  function resetData(withSeed) {
    var text = withSeed
      ? '会用示例数据覆盖当前内容。\n当前数据会先自动备份，之后可以用「恢复上次备份」找回。'
      : '会删除所有日程、任务、开销和长期规划。\n当前数据会先自动备份，之后可以用「恢复上次备份」找回。';
    App.confirm({
      title: withSeed ? '恢复示例数据？' : '清空全部数据？',
      text: text,
      okLabel: withSeed ? '恢复示例' : '清空',
      danger: !withSeed
    }).then(function (ok) {
      if (!ok) return;
      App.store.resetAll(withSeed);
      if (App.applyTheme) App.applyTheme();
      App.toast(withSeed ? '已恢复示例数据' : '已清空全部数据');
    });
  }

  function updateBudgetHint(viewEl, raw) {
    var n = toNumber(raw, 0);
    var el = viewEl.querySelector('[data-budget-hint]');
    if (el) el.textContent = '按 30 天算约 ' + U.money(n * 30) + '/月';
    var monthEl = viewEl.querySelector('[data-month-hint]');
    if (monthEl) {
      var now = new Date();
      var dim = U.daysInMonth(now.getFullYear(), now.getMonth() + 1);
      monthEl.textContent = '0 = 自动（按每日预算 × ' + dim + ' 天 ≈ ' + U.money(n * dim) + '/月）';
    }
  }

  /* ==================================================================
     五、视图
     ================================================================== */

  function bind(viewEl) {
    viewEl.onclick = function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var codeTa = t.closest('[data-share-code]');
      if (codeTa) {
        try { codeTa.focus(); codeTa.select(); } catch (err) { /* ignore */ }
        return;
      }
      var btn = t.closest('[data-act]');
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      if (act === 'gen-share') genShare(viewEl);
      else if (act === 'copy-share') copyShare(viewEl);
      else if (act === 'import-share') importShare(viewEl);
      else if (act === 'export-json') exportJson();
      else if (act === 'pick-file') pickFile(viewEl);
      else if (act === 'restore-backup') restoreBackupAction();
      else if (act === 'save-settings') saveSettings(viewEl);
      else if (act === 'set-theme') setTheme(btn.getAttribute('data-theme-value'), viewEl);
      else if (act === 'reset-demo') resetData(true);
      else if (act === 'reset-clear') resetData(false);
    };
    viewEl.oninput = function (e) {
      var t = e.target;
      if (t && t.hasAttribute && t.hasAttribute('data-budget')) updateBudgetHint(viewEl, t.value);
    };
    viewEl.onchange = function (e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      if (t.getAttribute('data-file') !== null) {
        var file = t.files && t.files[0];
        t.value = '';
        if (file) handleFile(file);
      }
    };
  }

  App.views.data = {
    render: function (viewEl) {
      var st = App.store.state;
      var s = st.settings || {};
      var info = statsOf(st);
      var theme = s.theme === 'light' || s.theme === 'dark' ? s.theme : 'auto';
      var daily = Number(s.dailyBudget) || 0;
      var month = Number(s.monthBudget) || 0;
      var now = new Date();
      var dim = U.daysInMonth(now.getFullYear(), now.getMonth() + 1);
      var rate = info.tasks ? Math.round((info.done / info.tasks) * 100) : 0;
      var backup = readBackupMeta();
      var demo = !!s.demo;
      var h = [];

      h.push('<div class="page data-page">');
      h.push('<div class="page-head data-head">');
      h.push('<div><h2 class="data-title">数据</h2>');
      h.push('<p class="muted data-sub">分享码同步、备份导入导出、预算与主题设置</p></div>');
      h.push('<span class="badge data-badge">' + (demo ? '示例数据' : '自己的数据') + '</span>');
      h.push('</div>');

      h.push('<div class="data-grid">');

      /* --- 数据概览 --- */
      h.push('<section class="card data-span2">');
      h.push('<div class="card-hd"><div><h3 class="card-title">数据概览</h3>');
      h.push('<p class="card-sub">全部保存在这台设备的浏览器里，不会上传</p></div></div>');
      h.push('<div class="card-bd">');
      h.push('<div class="data-stats">');
      h.push(statBox(info.days, '有记录的天数'));
      h.push(statBox(info.tasks, '任务总数'));
      h.push(statBox(rate + '%', '完成率（' + info.done + '/' + info.tasks + '）'));
      h.push(statBox(info.expenses, '开销记录'));
      h.push(statBox(info.roadmap, '长期规划'));
      h.push('</div>');
      h.push('<div class="data-meta">');
      h.push('<span class="pill">今天 ' + U.esc(U.fmtCN(U.todayKey())) + '</span>');
      h.push('<span class="muted">最近修改：' + U.esc(fmtWhen(st.updatedAt)) + '</span>');
      if (info.firstKey) {
        h.push('<span class="muted">记录范围：' + U.esc(info.firstKey) + ' ~ ' + U.esc(info.lastKey) + '</span>');
      }
      if (info.spent) h.push('<span class="muted">累计开销：' + U.esc(U.money(info.spent)) + '</span>');
      h.push('</div>');
      h.push('</div></section>');

      /* --- 分享码 --- */
      h.push('<section class="card data-span2">');
      h.push('<div class="card-hd"><div><h3 class="card-title"><span class="data-hd-ico">' + App.icon('share') +
        '</span>分享码</h3><p class="card-sub">发到另一台设备，粘贴导入即可同步全部数据</p></div>');
      h.push('<div class="card-tools"><span class="badge data-count" data-share-count>未生成</span></div></div>');
      h.push('<div class="card-bd data-stack">');
      h.push('<textarea class="textarea data-code" data-share-code rows="4" readonly spellcheck="false" ' +
        'placeholder="点下面的「生成分享码」，这里会出现 CHX1. 开头的分享码"></textarea>');
      h.push('<div class="data-actions">');
      h.push('<button class="btn btn-primary" type="button" data-act="gen-share">生成分享码</button>');
      h.push('<button class="btn btn-ghost" type="button" data-act="copy-share">复制</button>');
      h.push('<span class="hint" data-share-format>未生成</span>');
      h.push('</div>');
      h.push('<p class="hint">分享码包含全部数据（设置、固定课程、每天的任务与开销、长期规划）。' +
        '数据会先用 gzip 压缩；浏览器不支持压缩时会生成 CHX1R. 开头的长码，两种都能导入。</p>');
      h.push('</div></section>');

      /* --- 导入分享码 --- */
      h.push('<section class="card">');
      h.push('<div class="card-hd"><div><h3 class="card-title">导入分享码</h3>');
      h.push('<p class="card-sub">覆盖当前数据，导入前会先备份</p></div></div>');
      h.push('<div class="card-bd data-stack">');
      h.push('<textarea class="textarea data-paste" data-paste rows="3" spellcheck="false" ' +
        'placeholder="粘贴分享码，带换行或空格都不影响"></textarea>');
      h.push('<button class="btn btn-primary btn-block" type="button" data-act="import-share">解析并导入</button>');
      h.push('</div></section>');

      /* --- 文件备份 --- */
      h.push('<section class="card">');
      h.push('<div class="card-hd"><div><h3 class="card-title">文件备份</h3>');
      h.push('<p class="card-sub">导出 JSON 存档，或从文件恢复</p></div></div>');
      h.push('<div class="card-bd data-stack">');
      h.push('<p class="muted">导出的文件含全部数据，适合长期保存或换设备。</p>');
      h.push('<input type="file" class="data-file" data-file accept=".json,application/json" aria-label="选择 JSON 备份文件">');
      h.push('<div class="data-actions">');
      h.push('<button class="btn btn-ghost" type="button" data-act="export-json">导出 JSON</button>');
      h.push('<button class="btn btn-ghost" type="button" data-act="pick-file">从文件导入</button>');
      h.push('</div>');
      h.push('<div class="divider"></div>');
      h.push('<p class="muted data-backup-info">最近自动备份：' +
        (backup ? U.esc(fmtWhen(backup.at)) + ' · ' + U.esc(reasonLabel(backup.reason)) : '暂无') + '</p>');
      h.push('<button class="btn btn-ghost btn-block" type="button" data-act="restore-backup"' +
        (backup ? '' : ' disabled') + '>恢复上次备份</button>');
      h.push('<p class="hint">每次导入 / 清空 / 重置前都会自动备份；恢复备份会覆盖当前数据。</p>');
      h.push('</div></section>');

      /* --- 预算与设置 --- */
      h.push('<section class="card data-span2">');
      h.push('<div class="card-hd"><div><h3 class="card-title">预算与个人设置</h3>');
      h.push('<p class="card-sub">每天该花多少、想攒多少，都由你决定</p></div></div>');
      h.push('<div class="card-bd data-stack">');
      h.push('<div class="form-grid">');
      h.push('<div class="field"><label for="dataName">昵称</label>' +
        '<input class="input" id="dataName" data-setting="name" type="text" maxlength="20" ' +
        'placeholder="怎么称呼你（可留空）" value="' + U.esc(s.name || '') + '"></div>');
      h.push('<div class="field"><label for="dataGoal">省钱目标</label>' +
        '<input class="input" id="dataGoal" data-setting="saveGoal" type="text" maxlength="40" ' +
        'placeholder="例如：这个月少喝 10 杯奶茶" value="' + U.esc(s.saveGoal || '') + '"></div>');
      h.push('<div class="field"><label for="dataDaily">每日预算（元）</label>' +
        '<input class="input" id="dataDaily" data-setting="dailyBudget" data-budget type="number" ' +
        'inputmode="decimal" min="0" step="1" value="' + U.esc(String(daily)) + '">' +
        '<p class="hint" data-budget-hint>按 30 天算约 ' + U.esc(U.money(daily * 30)) + '/月</p></div>');
      h.push('<div class="field"><label for="dataMonth">月度预算（元）</label>' +
        '<input class="input" id="dataMonth" data-setting="monthBudget" type="number" ' +
        'inputmode="decimal" min="0" step="1" value="' + U.esc(String(month)) + '">' +
        '<p class="hint" data-month-hint>0 = 自动（按每日预算 × ' + dim + ' 天 ≈ ' +
        U.esc(U.money(daily * dim)) + '/月）</p></div>');
      h.push('</div>');
      h.push('<div class="data-actions">' +
        '<button class="btn btn-primary" type="button" data-act="save-settings">保存设置</button>' +
        '<span class="muted">保存后立即生效</span></div>');
      h.push('</div></section>');

      /* --- 主题 --- */
      h.push('<section class="card">');
      h.push('<div class="card-hd"><div><h3 class="card-title">主题</h3>');
      h.push('<p class="card-sub">跟随系统，或固定深浅色</p></div></div>');
      h.push('<div class="card-bd data-stack">');
      h.push('<div class="seg data-seg">');
      h.push(themeButton('auto', '跟随系统', theme));
      h.push(themeButton('light', '浅色', theme));
      h.push(themeButton('dark', '深色', theme));
      h.push('</div>');
      h.push('<p class="hint" data-theme-hint>当前：' + U.esc(themeLabel(theme)) + '。切换后立即保存。</p>');
      h.push('</div></section>');

      /* --- 示例与重置 --- */
      h.push('<section class="card">');
      h.push('<div class="card-hd"><div><h3 class="card-title">示例与重置</h3>');
      h.push('<p class="card-sub">操作前都会自动备份</p></div></div>');
      h.push('<div class="card-bd data-stack">');
      h.push('<p class="muted">当前：' + (demo ? '示例数据' : '你自己的数据') +
        '（' + info.courses + ' 门固定课程、' + info.days + ' 天记录）</p>');
      h.push('<button class="btn btn-ghost btn-block" type="button" data-act="reset-demo">恢复示例数据</button>');
      h.push('<button class="btn btn-danger btn-block" type="button" data-act="reset-clear">清空全部数据</button>');
      h.push('<p class="hint">清空会删除所有日程、任务、开销与规划；恢复示例会先备份当前数据。</p>');
      h.push('</div></section>');

      h.push('</div></div>');

      viewEl.innerHTML = h.join('');
      bind(viewEl);
    }
  };
})();

</script>
<script src="longtask.js"></script>
<script src="routine.js"></script>
<script src="sync-core.js"></script>
<script>App.boot();</script>
</body>
</html>
